<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultados de recursos</title>
  <style>
    :root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#f8fafc;--muted:#94a3b8;--accent:#3b82f6;--good:#10b981;--watch:#f59e0b;--signal:#f97316}
    *{box-sizing:border-box}body{margin:0;padding:28px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .shell{max-width:960px;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:24px}.top a,.btn{color:#fff;text-decoration:none;font-weight:700}
    h1{font-size:27px;margin:0 0 8px}.subtitle{color:var(--muted);line-height:1.55;margin:0}.notice{margin:20px 0;padding:15px 18px;border:1px solid #475569;background:#172033;border-radius:12px;color:#cbd5e1;line-height:1.5}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}.card h2{font-size:17px;margin:0 0 14px}.score{font-size:32px;font-weight:850}.label{color:var(--muted);font-size:13px}.bar{height:8px;background:#334155;border-radius:999px;overflow:hidden;margin:12px 0}.bar div{height:100%;background:var(--accent)}
    .status{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.CONCORDANT{background:#064e3b;color:#a7f3d0}.ADJACENT{background:#78350f;color:#fde68a}.MISMATCH_SIGNAL{background:#7c2d12;color:#fed7aa}.INSUFFICIENT_DATA{background:#334155;color:#cbd5e1}
    .detail{font-size:13px;color:#cbd5e1;line-height:1.5;margin-top:12px}.section{margin-top:30px}.section h2{font-size:20px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}.btn{display:inline-block;padding:11px 17px;border-radius:9px;background:var(--accent)}.btn.secondary{background:#475569}.loader{text-align:center;color:var(--muted);padding:60px}
    footer{text-align:center;color:#64748b;font-size:12px;margin-top:35px}@media(max-width:600px){body{padding:18px}.top{align-items:flex-start;flex-direction:column}.actions .btn{width:100%;text-align:center}}
  </style>
</head>
<body>
  <main class="shell" id="app"><div class="loader">Cargando resultados…</div></main>
  <footer>CRM Sharks &amp; Ray · Health Model Research</footer>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    const supabase=createClient('https://hjmmphkxbnuxnpcbawpg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqbW1waGt4Ym51eG5wY2Jhd3BnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNDgzNjQsImV4cCI6MjEwMTYyNDM2NH0.bCfCDKS1CT7lNCuJI-Vn4gQd-VbFpcEXVj5WfU3ZpNU');
    const app=document.getElementById('app');
    const labels={
      'es-MX':{title:'Perfil complementario de recursos',sub:'Los bloques se interpretan por separado. La puntuación NOM-035 permanece independiente.',notice:'Este resultado es una orientación de investigación, no un diagnóstico. No se muestran preguntas, respuestas ni marcadores críticos. Una señal de discrepancia significa que dos canales del mismo bloque no coinciden y requieren revisión; no significa que uno de ellos sea “verdadero” y el otro “falso”.',resource:'Recurso disponible',marker:'Severidad de marcadores',physical:'Recursos físicos',psychological:'Recursos psicológicos',goal:'Metas y dirección',social:'Recursos sociales',financial:'Recursos financieros',spiritual:'Valores e integridad',CONCORDANT:'Canales concordantes',ADJACENT:'Diferencia adyacente',MISMATCH_SIGNAL:'Señal de discrepancia',INSUFFICIENT_DATA:'Datos insuficientes',method:'Cómo leer la comparación',methodText:'Cada bloque contrasta la conclusión del recurso con marcadores de la misma área mediante bandas registradas. Los datos de sensores se comparan solo con una línea base de la misma persona. Las relaciones con NOM-035 se estudian por dominios y a nivel de muestra; las escalas no se mezclan directamente.',nom:'Ver resultados NOM-035',ai:'Abrir análisis conjunto',home:'Volver al panel',missing:'No se encontró un resultado reciente.'},
      'en-US':{title:'Complementary resource profile',sub:'Blocks are interpreted separately. The NOM-035 score remains independent.',notice:'This result is research orientation, not a diagnosis. Questions, answers, and critical markers are not displayed. A mismatch signal means that two channels within the same block do not agree and require review; it does not mean that one is “true” and the other “false.”',resource:'Available resource',marker:'Marker severity',physical:'Physical resources',psychological:'Psychological resources',goal:'Goals and direction',social:'Social resources',financial:'Financial resources',spiritual:'Values and integrity',CONCORDANT:'Concordant channels',ADJACENT:'Adjacent difference',MISMATCH_SIGNAL:'Mismatch signal',INSUFFICIENT_DATA:'Insufficient data',method:'How to read the comparison',methodText:'Each block contrasts the resource conclusion with markers from the same area using registered bands. Sensor data are compared only against the same person’s baseline. Relationships with NOM-035 are studied by domain and at sample level; the scales are not directly mixed.',nom:'View NOM-035 results',ai:'Open joint analysis',home:'Back to dashboard',missing:'No recent result was found.'}
    };
    const safe=(v)=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const scoreKeys={physical:'r_phys',psychological:'r_psych',goal:'r_goal',social:'r_social',financial:'r_fin',spiritual:'r_spiritual'};

    async function load(){
      const {data:{session}}=await supabase.auth.getSession();
      if(!session){location.href='auth.html';return}
      let result=JSON.parse(sessionStorage.getItem('health_resources_last_result')||'null');
      if(!result){
        const {data,error}=await supabase.from('health_resource_results').select('*,health_resource_sessions!inner(language)').order('created_at',{ascending:false}).limit(1).maybeSingle();
        if(error)throw error;
        if(data)result={resourceScores:data.resource_scores,resourceDeficits:data.resource_deficits,blockComparisons:Object.entries(data.block_comparisons||{}).map(([block,value])=>({block,...value})),language:data.health_resource_sessions.language};
      }
      if(!result){app.innerHTML=`<div class="card"><h1>${labels['es-MX'].missing}</h1><div class="actions"><a class="btn" href="extra_survey.html">Abrir evaluación</a></div></div>`;return}
      const lang=result.language==='en-US'?'en-US':'es-MX',t=labels[lang];document.documentElement.lang=lang;
      const comparisons=Array.isArray(result.blockComparisons)?result.blockComparisons:Object.entries(result.blockComparisons||{}).map(([block,value])=>({block,...value}));
      const byBlock=new Map(comparisons.map(item=>[item.block,item]));
      const cards=Object.entries(scoreKeys).map(([block,key])=>{const score=Number(result.resourceScores?.[key]);const cmp=byBlock.get(block)||{};const status=cmp.concordance||'INSUFFICIENT_DATA';return `<article class="card"><h2>${safe(t[block])}</h2><div class="label">${t.resource}</div><div class="score">${Number.isFinite(score)?score.toFixed(0):'—'}<span class="label"> / 100</span></div><div class="bar"><div style="width:${Number.isFinite(score)?Math.max(0,Math.min(100,score)):0}%"></div></div><span class="status ${safe(status)}">${safe(t[status]||status)}</span><div class="detail">${t.marker}: ${typeof cmp.markerSeverity==='number'?cmp.markerSeverity.toFixed(2):typeof cmp.marker_severity==='number'?cmp.marker_severity.toFixed(2):'—'} / 5</div></article>`}).join('');
      app.innerHTML=`<div class="top"><div><h1>${t.title}</h1><p class="subtitle">${t.sub}</p></div><a href="index.html">${t.home}</a></div><div class="notice">${t.notice}</div><section class="grid">${cards}</section><section class="section"><h2>${t.method}</h2><div class="card"><p class="subtitle">${t.methodText}</p></div></section><div class="actions"><a class="btn" href="ai_analyst.html">${t.ai}</a><a class="btn secondary" href="resultados.html">${t.nom}</a><a class="btn secondary" href="index.html">${t.home}</a></div>`;
    }
    load().catch(error=>{console.error(error);app.innerHTML=`<div class="card"><h1>Error</h1><p class="subtitle">${safe(error.message)}</p><div class="actions"><a class="btn secondary" href="index.html">Volver</a></div></div>`});
  </script>
<script src="./site_navigation.js"></script>
</body>
</html>
