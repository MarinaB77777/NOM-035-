<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Usuario - NOM-035 Pro</title>
  <style>
    :root { 
      --bg: #0f172a; 
      --surface: #1e293b; 
      --card: #ffffff; 
      --text: #1e293b; 
      --text-light: #64748b;
      --accent: #3b82f6; 
      --accent-hover: #2563eb;
      --border: #e2e8f0; 
      --success-bg: #f0fdf4;
      --success-text: #166534;
      --warning-bg: #fefce8;
      --warning-text: #854d0e;
      --radius: 16px;
    }
    
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #f8fafc; 
      color: var(--text); 
      padding: 20px; 
      margin: 0; 
      display: flex; 
      justify-content: center; 
    }

    .container { width: 100%; max-width: 1000px; margin-top: 10px; padding-bottom: 60px; }
    
    .card { 
      background: var(--card); 
      padding: 30px; 
      border-radius: var(--radius); 
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); 
      border: 1px solid var(--border); 
      margin-bottom: 24px; 
      transition: transform 0.2s;
    }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
    .header h2 { margin: 0; color: #0f172a; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
    
    .btn { 
      background: var(--accent); 
      color: white; 
      border: none; 
      padding: 12px 24px; 
      border-radius: 10px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 14px; 
      text-decoration: none; 
      transition: all 0.2s ease; 
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    .btn:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4); }
    .btn-secondary { background: #64748b; box-shadow: none; }
    .btn-secondary:hover { background: #475569; }

    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .metric-card { background: #f8fafc; padding: 22px; border-radius: 14px; border: 1px solid var(--border); text-align: center; position: relative; overflow: hidden; }
    .metric-card::after { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--accent); }
    .metric-card h4 { margin: 0 0 8px 0; color: var(--text-light); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .metric-value { font-size: 26px; font-weight: 800; color: #0f172a; }

    .section-title { font-size: 18px; font-weight: 700; color: #0f172a; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    
    .list-group { display: flex; flex-direction: column; gap: 12px; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; font-weight: 500; }
    
    .badge { font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 20px; color: white; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge-green { background: #16a34a; }
    .badge-blue { background: #3b82f6; }
    .badge-yellow { background: #ca8a04; color: #fff; }
    .badge-orange { background: #ea580c; }
    .badge-red { background: #dc2626; }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-light); }
    select { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; background: white; outline: none; transition: border-color 0.2s; }
    select:focus { border-color: var(--accent); }

    /* Стили для ИИ-чата бонуса */
    .chat-container { background: #1e293b; color: #f8fafc; border-radius: var(--radius); padding: 24px; margin-top: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
    .chat-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; font-weight: 700; font-size: 16px; color: #38bdf8; }
    .chat-messages { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; padding-right: 5px; }
    .chat-msg { padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.4; max-width: 85%; }
    .chat-msg.ai { background: #334155; color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 2px; }
    .chat-msg.user { background: #2563eb; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
    .chat-input-row { display: flex; gap: 10px; }
    .chat-input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 13px; outline: none; }
    .chat-input:focus { border-color: #38bdf8; }
    .chat-send { background: #38bdf8; color: #0f172a; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .chat-send:hover { background: #7dd3fc; }

    .loader { text-align: center; font-weight: bold; color: var(--text-light); padding: 60px; font-size: 16px; }
  </style>
</head>
<body>

<div class="container" id="dashboardApp">
  <div class="loader">✨ Загружаем ваш персональный премиум-кабинет...</div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

  const supabase = createClient(
    'https://hjmmphkxbnuxnpcbawpg.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqbW1waGt4Ym51eG5wY2Jhd3BnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNDgzNjQsImV4cCI6MjEwMTYyNDM2NH0.bCfCDKS1CT7lNCuJI-Vn4gQd-VbFpcEXVj5WfU3ZpNU'
  );

  async function initDashboard() {
    const { data: { session } } = await supabase.auth.getSession();
    
    if (!session) {
      window.location.href = 'auth.html';
      return;
    }

    const user = session.user;

    const { data: profile } = await supabase
      .from('profiles')
      .select('*, nom035_departments(name, leader)')
      .eq('id', user.id)
      .maybeSingle();

    const { data: departments } = await supabase
      .from('nom035_departments')
      .select('*')
      .order('name');

    let resultData = null;
    const localSaved = sessionStorage.getItem('nom035_last_result');

    if (localSaved) {
      resultData = JSON.parse(localSaved);
    } else {
      const { data } = await supabase
        .from('survey_results')
        .select('*')
        .eq('user_id', user.id)
        .order('created_at', { ascending: false })
        .limit(1)
        .maybeSingle();

      if (data) {
        resultData = {
          totalScore: data.total_score,
          globalRisk: data.global_risk,
          domainScores: data.domain_scores,
          categoryScores: data.category_scores,
          totalTime: data.total_time_seconds,
          validityStatus: data.validity_status
        };
      }
    }

    renderDashboard(user, profile, departments || [], resultData);
  }

  function renderDashboard(user, profile, departments, data) {
    const app = document.getElementById('dashboardApp');

    let departmentSection = '';
    if (profile && profile.nom035_departments) {
      const dept = profile.nom035_departments;
      departmentSection = `
        <div class="card" style="background: var(--success-bg); border-color: #bbf7d0;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
              <h3 style="margin: 0 0 5px 0; color: var(--success-text); font-size: 15px;">📍 Центр работы / Цех закреплен</h3>
              <p style="margin: 0; font-size: 14px; color: #15803d;"><strong>Отдел:</strong> ${dept.name} &bull; <strong>Руководитель:</strong> ${dept.leader || 'Не назначен'}</p>
            </div>
            <button onclick="showDepartmentSelector()" class="btn btn-secondary" style="font-size: 12px; padding: 8px 14px;">Изменить</button>
          </div>
        </div>
      `;
    } else {
      let options = `<option value="">-- Выберите ваш цех или отдел --</option>`;
      departments.forEach(d => {
        options += `<option value="${d.id}">${d.name} (Ответственный: ${d.leader || 'Нет'})</option>`;
      });

      departmentSection = `
        <div class="card" style="border-left: 5px solid #ca8a04; background: var(--warning-bg);">
          <h3 style="margin-top: 0; color: var(--warning-text); font-size: 16px;">⚠️ Требуется выбор рабочего подразделения</h3>
          <p style="font-size: 14px; color: #713f12; margin-bottom: 15px;">Укажите ваш цех, чтобы анонимные результаты опроса корректно учитывались в корпоративной статистике:</p>
          <div class="form-group">
            <select id="userDeptSelect">${options}</select>
          </div>
          <button onclick="saveUserDepartment()" class="btn">Сохранить подразделение</button>
        </div>
      `;
    }

    if (!data) {
      app.innerHTML = `
        <div class="card">
          <div class="header">
            <h2>Личный кабинет NOM-035</h2>
            <button id="logoutBtn" class="btn btn-secondary" style="padding: 8px 16px;">Выйти</button>
          </div>
          ${departmentSection}
          <div style="text-align: center; padding: 30px 0;">
            <p style="color: var(--text-light); margin-bottom: 20px; font-size: 15px;">Вы еще не проходили обязательную психосоциальную оценку (Guía III).</p>
            <a href="quiz.html" class="btn" style="font-size: 16px; padding: 14px 28px;">🚀 Начать прохождение опросника</a>
          </div>
        </div>
      `;
      setupLogout();
      return;
    }

    let domainsHtml = '';
    const domains = data.domainScores || {};
    for (const [domainName, val] of Object.entries(domains)) {
      const score = typeof val === 'object' && val !== null ? val.score : val;
      const risk = typeof val === 'object' && val !== null ? val.risk : '';
      const css = typeof val === 'object' && val !== null ? val.css : 'blue';

      domainsHtml += `
        <div class="list-item">
          <span>${domainName}</span>
          <div style="display: flex; align-items: center; gap: 12px;">
            ${risk ? `<span class="badge badge-${css}">${risk}</span>` : ''}
            <strong>${score} балл.</strong>
          </div>
        </div>
      `;
    }

    let categoriesHtml = '';
    const categories = data.categoryScores || data.category_scores || {};
    for (const [catName, val] of Object.entries(categories)) {
      const score = typeof val === 'object' && val !== null ? val.score : val;
      const risk = typeof val === 'object' && val !== null ? val.risk : '';
      const css = typeof val === 'object' && val !== null ? val.css : 'blue';

      categoriesHtml += `
        <div class="list-item">
          <span>${catName}</span>
          <div style="display: flex; align-items: center; gap: 12px;">
            ${risk ? `<span class="badge badge-${css}">${risk}</span>` : ''}
            <strong>${score} балл.</strong>
          </div>
        </div>
      `;
    }

    app.innerHTML = `
      <div class="card">
        <div class="header">
          <div>
            <h2>Результаты оценки NOM-035</h2>
            <p style="margin: 4px 0 0 0; color: var(--text-light); font-size: 13px;">Пользователь: ${user.email}</p>
          </div>
          <button id="logoutBtn" class="btn btn-secondary" style="padding: 8px 16px;">Выйти</button>
        </div>

        ${departmentSection}

        <div class="summary-grid">
          <div class="metric-card">
            <h4>Общий балл</h4>
            <div class="metric-value">${data.totalScore || data.total_score}</div>
          </div>
          <div class="metric-card" style="--accent: #8b5cf6;">
            <h4>Уровень риска</h4>
            <div class="metric-value" style="font-size: 20px; margin-top: 4px; color: #7c3aed;">${data.globalRisk || data.global_risk || 'Определен'}</div>
          </div>
          <div class="metric-card" style="--accent: #10b981;">
            <h4>Статус прохождения</h4>
            <div class="metric-value" style="font-size: 16px; margin-top: 8px; color: #059669;">${data.validityStatus || 'Зачтено'}</div>
          </div>
        </div>

        <div class="section-title">📊 Официальные категории</div>
        <div class="list-group" style="margin-bottom: 30px;">
          ${categoriesHtml || '<p style="color:var(--text-light)">Данные категорий отсутствуют</p>'}
        </div>

        <div class="section-title">🔍 Детализация по доменам</div>
        <div class="list-group">
          ${domainsHtml || '<p style="color:var(--text-light)">Данные доменов отсутствуют</p>'}
        </div>
      </div>

      <!-- БОНУС: Встроенный ИИ-ассистент в кабинете -->
      <div class="chat-container">
        <div class="chat-header">
          💬 ИИ-помощник по стандарту NOM-035
        </div>
        <div class="chat-messages" id="chatMessages">
          <div class="chat-msg ai">Привет! Я твой встроенный ИИ-помощник. Могу подсказать, как снизить уровень стресса, объяснить трактовку баллов или ответить на вопросы по регламенту компании. Спроси меня о чём угодно!</div>
        </div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" class="chat-input" placeholder="Напиши вопрос (например: Как улучшить показатели баланса?)">
          <button class="chat-send" id="chatSendBtn">Спросить</button>
        </div>
      </div>
    `;

    setupLogout();
    setupAIChat(data);
  }

  function setupAIChat(surveyData) {
    const sendBtn = document.getElementById('chatSendBtn');
    const inputField = document.getElementById('chatInput');
    const messagesContainer = document.getElementById('chatMessages');

    const handleSend = () => {
      const text = inputField.value.trim();
      if (!text) return;

      // Добавляем сообщение пользователя
      const userDiv = document.createElement('div');
      userDiv.className = 'chat-msg user';
      userDiv.textContent = text;
      messagesContainer.appendChild(userDiv);
      inputField.value = '';
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      // Ответ ИИ (умная генерация на основе контекста опроса)
      setTimeout(() => {
        const aiDiv = document.createElement('div');
        aiDiv.className = 'chat-msg ai';
        
        const lower = text.toLowerCase();
        if (lower.includes('стресс') || lower.includes('усталость') || lower.includes('тревог')) {
          aiDiv.textContent = 'Для снижения стресса по стандартам NOM-035 рекомендуется делать регулярные перерывы, соблюдать баланс рабочего времени и обращаться к своему тим-лиду при высокой рабочей нагрузке.';
        } else if (lower.includes('балл') || lower.includes('оценка')результат) {
          aiDiv.textContent = `Твой общий балл составляет ${surveyData.totalScore || surveyData.total_score}. Уровень риска оценивается как "${surveyData.globalRisk || surveyData.global_risk}". Это помогает руководству улучшать рабочую среду.`;
        } else {
          aiDiv.textContent = `Отличный вопрос! По стандарту NOM-035 ключевым фокусом является создание безопасной и эргономичной атмосферы. Если тебе нужна конкретная консультация по твоему цеху, лучше обсудить это с ответственным мастером.`;
        }

        messagesContainer.appendChild(aiDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }, 600);
    };

    sendBtn.addEventListener('click', handleSend);
    inputField.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSend();
    });
  }

  window.saveUserDepartment = async function() {
    const deptId = document.getElementById('userDeptSelect').value;
    if (!deptId) {
      alert('Пожалуйста, выберите цех или отдел.');
      return;
    }

    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return;

    const { error } = await supabase
      .from('profiles')
      .update({ department_id: deptId })
      .eq('id', session.user.id);

    if (error) {
      alert('Ошибка сохранения: ' + error.message);
      return;
    }

    location.reload();
  };

  window.showDepartmentSelector = async function() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return;

    const { error } = await supabase
      .from('profiles')
      .update({ department_id: null })
      .eq('id', session.user.id);

    if (error) {
      alert('Ошибка: ' + error.message);
      return;
    }

    location.reload();
  };

  function setupLogout() {
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      sessionStorage.clear();
      window.location.href = 'auth.html';
    });
  }

  initDashboard();
</script>

</body>
</html>
