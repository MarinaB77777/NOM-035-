<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Usuario - NOM-035 Pro</title>
  <style>
    :root { 
      --bg: #0f172a; 
      --surface: #1e293b; 
      --card: #ffffff; 
      --text: #1e293b; 
      --text-light: #64748b;
      --accent: #3b82f6; 
      --accent-hover: #2563eb;
      --border: #e2e8f0; 
      --success-bg: #f0fdf4;
      --success-text: #166534;
      --warning-bg: #fefce8;
      --warning-text: #854d0e;
      --radius: 16px;
    }
    
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #f8fafc; 
      color: var(--text); 
      padding: 20px; 
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .container { width: 100%; max-width: 1000px; margin-top: 10px; padding-bottom: 60px; }
    
    .card { 
      background: var(--card); 
      padding: 30px; 
      border-radius: var(--radius); 
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); 
      border: 1px solid var(--border); 
      margin-bottom: 24px; 
      transition: transform 0.2s;
    }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .header h2 { margin: 0; color: #0f172a; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
    .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    
    .btn { 
      background: var(--accent); 
      color: white; 
      border: none; 
      padding: 10px 18px; 
      border-radius: 10px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 14px; 
      text-decoration: none; 
      transition: all 0.2s ease; 
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    .btn:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4); }
    .btn-secondary { background: #64748b; box-shadow: none; }
    .btn-secondary:hover { background: #475569; }
    .btn-sensors { background: #0284c7; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); }
    .btn-sensors:hover { background: #0369a1; }

    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .metric-card { background: #f8fafc; padding: 22px; border-radius: 14px; border: 1px solid var(--border); text-align: center; position: relative; overflow: hidden; }
    .metric-card::after { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--accent); }
    .metric-card h4 { margin: 0 0 8px 0; color: var(--text-light); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .metric-value { font-size: 26px; font-weight: 800; color: #0f172a; }

    .section-title { font-size: 18px; font-weight: 700; color: #0f172a; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    
    .list-group { display: flex; flex-direction: column; gap: 12px; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; font-weight: 500; }
    
    .badge { font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 20px; color: white; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge-green { background: #16a34a; }
    .badge-blue { background: #3b82f6; }
    .badge-yellow { background: #ca8a04; color: #fff; }
    .badge-orange { background: #ea580c; }
    .badge-red { background: #dc2626; }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-light); }
    select { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; background: white; outline: none; transition: border-color 0.2s; }
    select:focus { border-color: var(--accent); }

    .chat-container { background: #1e293b; color: #f8fafc; border-radius: var(--radius); padding: 24px; margin-top: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
    .loader { text-align: center; font-weight: bold; color: var(--text-light); padding: 60px; font-size: 16px; }
    .indicators-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; }
    .indicator-card { background:#f8fafc; border:1px solid var(--border); border-radius:14px; padding:16px; text-align:center; }
    .indicator-card h4 { margin:0 0 10px; color:var(--text-light); font-size:11px; text-transform:uppercase; }
    .color-square { min-height:72px; border-radius:10px; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:800; font-size:15px; text-shadow:0 1px 2px rgba(0,0,0,.25); padding:8px; }
    .color-square small { font-size:15px; }.indicator-meta,.indicator-time { font-size:11px; color:var(--text-light); margin-top:6px; }.indicator-n{margin-left:5px}
    .aggregate-note { color:var(--text-light); font-size:12px; line-height:1.55; margin:0 0 16px; }
    footer { text-align:center; color:var(--text-light); font-size:12px; padding:8px; }
  </style>
</head>
<body>

<div class="container" id="dashboardApp">
  <div class="loader">✨ Cargando panel de control...</div>
</div>
<footer>CRM Sharks &amp; Ray · NOM-035 + Health Model Research</footer>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
  import { indicatorCardHtml, escapeHtml } from './indicator_observatory.js';

  const supabase = createClient(
    'https://hjmmphkxbnuxnpcbawpg.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqbW1waGt4Ym51eG5wY2Jhd3BnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNDgzNjQsImV4cCI6MjEwMTYyNDM2NH0.bCfCDKS1CT7lNCuJI-Vn4gQd-VbFpcEXVj5WfU3ZpNU'
  );

  async function initDashboard() {
    const { data: { session } } = await supabase.auth.getSession();
    
    if (!session) {
      window.location.href = 'auth.html';
      return;
    }

    const user = session.user;

    const { data: profile } = await supabase
      .from('profiles')
      .select('*, nom035_departments(name, leader)')
      .eq('id', user.id)
      .maybeSingle();

    const { data: departments } = await supabase
      .from('nom035_departments')
      .select('*')
      .order('name');

    let resultData = null;
    const localSaved = sessionStorage.getItem('nom035_last_result');

    if (localSaved) {
      resultData = JSON.parse(localSaved);
    } else {
      const { data } = await supabase
        .from('survey_results')
        .select('*')
        .eq('user_id', user.id)
        .order('created_at', { ascending: false })
        .limit(1)
        .maybeSingle();

      if (data) {
        resultData = {
          totalScore: data.total_score,
          globalRisk: data.global_risk,
          domainScores: data.domain_scores,
          categoryScores: data.category_scores,
          totalTime: data.total_time_seconds,
          validityStatus: data.validity_status
        };
      }
    }

    renderDashboard(user, profile, departments || [], resultData);
    await loadDepartmentObservatory(Boolean(profile?.department_id));
    await loadMeasurementAssignments();
  }

  function departmentObservatorySection() {
    return `
      <div class="card">
        <div class="section-title">Estado agregado de mi departamento</div>
        <p class="aggregate-note">Es la misma vista organizacional que recibe el observador del taller: sólo agregados con tamaño de celda seguro, sin personas ni contribuciones individuales.</p>
        <div id="departmentObservatory" class="indicators-grid"><div class="loader" style="padding:20px">Cargando indicadores seguros…</div></div>
      </div>`;
  }

  async function loadDepartmentObservatory(hasDepartment) {
    const container = document.getElementById('departmentObservatory');
    if (!container) return;
    if (!hasDepartment) {
      container.innerHTML = '<p style="color:var(--text-light)">Selecciona primero tu departamento.</p>';
      return;
    }
    const { data, error } = await supabase.rpc('get_department_indicator_current', { p_department_id: null });
    if (error) {
      container.innerHTML = `<p style="color:#b91c1c">${escapeHtml(error.message)}</p>`;
      return;
    }
    if (!data?.length) {
      container.innerHTML = '<p style="color:var(--text-light)">Todavía no existen agregados seguros para este departamento.</p>';
      return;
    }
    container.innerHTML = data.map(item => indicatorCardHtml(item, { aggregate:true })).join('');
  }

  function samplingSection() {
    return `
      <div class="card">
        <div class="section-title">Participación en el muestreo</div>
        <p class="aggregate-note">Este dato se utiliza únicamente para distribuir de forma proporcional la muestra oficial NOM-035. No aparece en los resultados del departamento.</p>
        <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end">
          <div><label for="samplingStratum">Estrato requerido por la NOM-035</label><select id="samplingStratum"><option value="">Selecciona</option><option value="women">Mujeres</option><option value="men">Hombres</option></select></div>
          <div><label for="samplingShift">Turno (opcional)</label><input id="samplingShift" style="width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:10px" placeholder="Ej. mañana"></div>
          <button class="btn" onclick="saveSamplingProfile()">Guardar</button>
        </div>
        <div id="samplingMessage" style="font-size:12px;color:var(--text-light);margin-top:10px"></div>
        <div id="measurementAssignments" class="list-group" style="margin-top:14px"></div>
      </div>`;
  }

  window.saveSamplingProfile = async function() {
    const stratum = document.getElementById('samplingStratum')?.value;
    const shift = document.getElementById('samplingShift')?.value.trim() || null;
    const message = document.getElementById('samplingMessage');
    if (!stratum) {
      message.textContent = 'Selecciona el estrato de muestreo.';
      return;
    }
    const { error } = await supabase.rpc('set_my_sampling_roster', {
      p_nom035_sampling_stratum: stratum,
      p_shift_code: shift
    });
    message.textContent = error ? 'No se guardó: ' + error.message : 'Datos de muestreo guardados.';
    if (!error) await loadMeasurementAssignments();
  };

  async function loadMeasurementAssignments() {
    const container = document.getElementById('measurementAssignments');
    if (!container) return;
    const { data, error } = await supabase.rpc('get_my_measurement_assignments');
    if (error) {
      container.innerHTML = `<p style="color:#b91c1c">${escapeHtml(error.message)}</p>`;
      return;
    }
    if (!data?.length) {
      container.innerHTML = '<p style="color:var(--text-light)">No hay mediciones aleatorias asignadas en este momento.</p>';
      return;
    }
    container.innerHTML = data.map(item => {
      const timing = item.scheduled_at
        ? new Date(item.scheduled_at).toLocaleString('es-MX')
        : 'Selección oficial sin hora aleatoria';
      return `<div class="list-item"><span>${escapeHtml(item.protocol_code)}</span><span>${escapeHtml(timing)} · ${escapeHtml(item.assignment_status)}</span></div>`;
    }).join('');
  }

  function renderDashboard(user, profile, departments, data) {
    const app = document.getElementById('dashboardApp');

    let departmentSection = '';
    if (profile && profile.nom035_departments) {
      const dept = profile.nom035_departments;
      departmentSection = `
        <div class="card" style="background: var(--success-bg); border-color: #bbf7d0;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
              <h3 style="margin: 0 0 5px 0; color: var(--success-text); font-size: 15px;">📍 Centro de trabajo / Taller asignado</h3>
              <p style="margin: 0; font-size: 14px; color: #15803d;"><strong>Departamento:</strong> ${escapeHtml(dept.name)} &bull; <strong>Responsable:</strong> ${escapeHtml(dept.leader || 'Sin asignar')}</p>
            </div>
            <button onclick="showDepartmentSelector()" class="btn btn-secondary" style="font-size: 12px; padding: 8px 14px;">Cambiar</button>
          </div>
        </div>
      `;
    } else {
      let options = `<option value="">-- Selecciona tu taller o departamento --</option>`;
      departments.forEach(d => {
        options += `<option value="${escapeHtml(d.id)}">${escapeHtml(d.name)} (Responsable: ${escapeHtml(d.leader || 'Ninguno')})</option>`;
      });

      departmentSection = `
        <div class="card" style="border-left: 5px solid #ca8a04; background: var(--warning-bg);">
          <h3 style="margin-top: 0; color: var(--warning-text); font-size: 16px;">⚠️ Selección de departamento obligatoria</h3>
          <p style="font-size: 14px; color: #713f12; margin-bottom: 15px;">Por favor selecciona tu área de trabajo para agrupar correctamente los resultados anónimos:</p>
          <div class="form-group">
            <select id="userDeptSelect">${options}</select>
          </div>
          <button onclick="saveUserDepartment()" class="btn">Guardar departamento</button>
        </div>
      `;
    }

    // Common header actions containing the Sensors link
    const headerActionsHtml = `
      <div class="header-actions">
        <a href="sensors.html" class="btn btn-sensors">🛰️ Sensores y GPS</a>
        <a href="account_security.html" class="btn btn-secondary">🔐 Seguridad</a>
        <button id="logoutBtn" class="btn btn-secondary" style="padding: 10px 16px;">Cerrar Sesión</button>
      </div>
    `;

    if (!data) {
      app.innerHTML = `
        <div class="card">
          <div class="header">
            <h2>Mi Panel NOM-035</h2>
            ${headerActionsHtml}
          </div>
          ${departmentSection}
          ${departmentObservatorySection()}
          ${samplingSection()}
          <div style="text-align: center; padding: 30px 0;">
            <p style="color: var(--text-light); margin-bottom: 20px; font-size: 15px;">Aún no has realizado la evaluación psicosocial obligatoria (Guía III).</p>
            <a href="evaluacion.html" class="btn" style="font-size: 16px; padding: 14px 28px;">🚀 Realizar Cuestionario (Guía III)</a>
          </div>
        </div>
      `;
      setupLogout();
      return;
    }

    let domainsHtml = '';
    const domains = data.domainScores || {};
    for (const [domainName, val] of Object.entries(domains)) {
      const score = typeof val === 'object' && val !== null ? val.score : val;
      const risk = typeof val === 'object' && val !== null ? val.risk : '';
      const css = typeof val === 'object' && val !== null ? val.css : 'blue';

      domainsHtml += `
        <div class="list-item">
          <span>${escapeHtml(domainName)}</span>
          <div style="display: flex; align-items: center; gap: 12px;">
            ${risk ? `<span class="badge badge-${escapeHtml(css)}">${escapeHtml(risk)}</span>` : ''}
            <strong>${escapeHtml(score)} pts</strong>
          </div>
        </div>
      `;
    }

    let categoriesHtml = '';
    const categories = data.categoryScores || data.category_scores || {};
    for (const [catName, val] of Object.entries(categories)) {
      const score = typeof val === 'object' && val !== null ? val.score : val;
      const risk = typeof val === 'object' && val !== null ? val.risk : '';
      const css = typeof val === 'object' && val !== null ? val.css : 'blue';

      categoriesHtml += `
        <div class="list-item">
          <span>${escapeHtml(catName)}</span>
          <div style="display: flex; align-items: center; gap: 12px;">
            ${risk ? `<span class="badge badge-${escapeHtml(css)}">${escapeHtml(risk)}</span>` : ''}
            <strong>${escapeHtml(score)} pts</strong>
          </div>
        </div>
      `;
    }

    app.innerHTML = `
      <div class="card">
        <div class="header">
          <div>
            <h2>Panel de Resultados - NOM-035</h2>
            <p style="margin: 4px 0 0 0; color: var(--text-light); font-size: 13px;">Usuario: ${escapeHtml(user.email)}</p>
          </div>
          ${headerActionsHtml}
        </div>

        ${departmentSection}
        ${departmentObservatorySection()}
        ${samplingSection()}

        <div class="summary-grid">
          <div class="metric-card">
            <h4>Puntuación Global</h4>
            <div class="metric-value">${escapeHtml(data.totalScore ?? data.total_score ?? '--')}</div>
          </div>
          <div class="metric-card" style="--accent: #8b5cf6;">
            <h4>Nivel de Riesgo</h4>
            <div class="metric-value" style="font-size: 20px; margin-top: 4px; color: #7c3aed;">${escapeHtml(data.globalRisk ?? data.global_risk ?? 'Sin datos')}</div>
          </div>
          <div class="metric-card" style="--accent: #10b981;">
            <h4>Estado de Validez</h4>
            <div class="metric-value" style="font-size: 16px; margin-top: 8px; color: #059669;">${escapeHtml(data.validityStatus ?? 'Sin datos')}</div>
          </div>
        </div>

        <div class="section-title">📊 Categorías Oficiales</div>
        <div class="list-group" style="margin-bottom: 30px;">
          ${categoriesHtml || '<p style="color:var(--text-light)">Sin datos de categorías</p>'}
        </div>

        <div class="section-title">🔍 Dominios Detallados</div>
        <div class="list-group">
          ${domainsHtml || '<p style="color:var(--text-light)">Sin datos de dominios</p>'}
        </div>
      </div>

      <div class="chat-container">
        <div class="chat-header" style="color: #38bdf8; font-weight: 700; font-size: 16px; margin-bottom: 12px;">
          🤖 Análisis conjunto explicable
        </div>
        <p style="color:#cbd5e1; line-height:1.55; margin:0 0 16px; font-size: 13px;">El analista compara los dominios oficiales NOM-035 con los bloques correspondientes de Health Model sin mezclar las escalas, sin diagnóstico y sin utilizar respuestas originales.</p>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <a class="btn" href="extra_survey.html">Completar Health Model</a>
          <a class="btn" href="ai_analyst.html" style="background:#8b5cf6;">Abrir analista IA</a>
        </div>
      </div>
    `;

    setupLogout();
  }

  window.saveUserDepartment = async function() {
    const deptId = document.getElementById('userDeptSelect').value;
    if (!deptId) {
      alert('Por favor selecciona un departamento.');
      return;
    }

    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return;

    const { error } = await supabase
      .from('profiles')
      .update({ department_id: deptId })
      .eq('id', session.user.id);

    if (error) {
      alert('Error al guardar: ' + error.message);
      return;
    }

    location.reload();
  };

  window.showDepartmentSelector = async function() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return;

    const { error } = await supabase
      .from('profiles')
      .update({ department_id: null })
      .eq('id', session.user.id);

    if (error) {
      alert('Error: ' + error.message);
      return;
    }

    location.reload();
  };

  function setupLogout() {
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      sessionStorage.clear();
      window.location.href = 'auth.html';
    });
  }

  initDashboard();
</script>

<script src="./site_navigation.js"></script>
</body>
</html>
