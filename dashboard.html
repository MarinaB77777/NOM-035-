<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Usuario - NOM-035</title>
  <style>
    :root { --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --muted: #64748b; --accent: #2563eb; --border: #e2e8f0; --success: #16a34a; --warning: #ca8a04; --danger: #dc2626; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 900px; margin-top: 20px; }
    
    .card { background: var(--card); padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid var(--border); margin-bottom: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
    .header h2 { margin: 0; color: #0f172a; font-size: 22px; }
    
    .btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; text-decoration: none; transition: background 0.2s; display: inline-block; }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }

    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .metric-card { background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
    .metric-card h4 { margin: 0 0 8px 0; color: var(--muted); font-size: 13px; text-transform: uppercase; }
    .metric-value { font-size: 22px; font-weight: bold; color: #0f172a; }

    .section-title { font-size: 16px; font-weight: bold; color: #0f172a; margin-bottom: 15px; border-left: 4px solid var(--accent); padding-left: 10px; }
    
    .list-group { display: flex; flex-direction: column; gap: 10px; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
    
    .badge { font-size: 12px; font-weight: bold; padding: 3px 10px; border-radius: 6px; color: white; text-transform: capitalize; }
    .badge-green { background: #16a34a; }
    .badge-blue { background: #2563eb; }
    .badge-yellow { background: #ca8a04; color: #fff; }
    .badge-orange { background: #ea580c; }
    .badge-red { background: #dc2626; }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; color: var(--muted); }
    select { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; box-sizing: border-box; background: white; }

    .loader { text-align: center; font-weight: bold; color: var(--muted); padding: 40px; }
  </style>
</head>
<body>

<div class="container" id="dashboardApp">
  <div class="loader">Cargando panel de control...</div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

  const supabase = createClient(
    'https://hjmmphkxbnuxnpcbawpg.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqbW1waGt4Ym51eG5wY2Jhd3BnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNDgzNjQsImV4cCI6MjEwMTYyNDM2NH0.bCfCDKS1CT7lNCuJI-Vn4gQd-VbFpcEXVj5WfU3ZpNU'
  );

  async function initDashboard() {
    const { data: { session } } = await supabase.auth.getSession();
    
    if (!session) {
      window.location.href = 'auth.html';
      return;
    }

    const user = session.user;

    // 1. Загружаем профиль пользователя (цех / мастер)
    const { data: profile } = await supabase
      .from('nom035_profiles')
      .select('*, nom035_departments(name, leader)')
      .eq('user_id', user.id)
      .maybeSingle();

    // 2. Загружаем список всех доступных цехов/департаментов для привязки
    const { data: departments } = await supabase
      .from('nom035_departments')
      .select('*')
      .order('name');

    // 3. Загружаем результаты опроса
    let resultData = null;
    const localSaved = sessionStorage.getItem('nom035_last_result');

    if (localSaved) {
      resultData = JSON.parse(localSaved);
    } else {
      const { data } = await supabase
        .from('nom035_survey_results')
        .select('*')
        .eq('user_id', user.id)
        .order('created_at', { ascending: false })
        .limit(1)
        .maybeSingle();

      if (data) {
        resultData = {
          totalScore: data.total_score,
          globalRisk: data.global_risk,
          domainScores: data.domain_scores,
          categoryScores: data.category_scores,
          totalTime: data.total_time_seconds,
          validityStatus: data.validity_status
        };
      }
    }

    renderDashboard(user, profile, departments || [], resultData);
  }

  function renderDashboard(user, profile, departments, data) {
    const app = document.getElementById('dashboardApp');

    let departmentSection = '';
    if (profile && profile.nom035_departments) {
      const dept = profile.nom035_departments;
      departmentSection = `
        <div class="card" style="background: #f0fdf4; border-color: #bbf7d0;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
              <h3 style="margin: 0 0 5px 0; color: #166534; font-size: 16px;">📍 Tu Centro de Trabajo / Taller Asignado</h3>
              <p style="margin: 0; font-size: 14px; color: #15803d;"><strong>Departamento:</strong> ${dept.name} | <strong>Responsable / Master:</strong> ${dept.leader || 'Sin asignar'}</p>
            </div>
            <button onclick="showDepartmentSelector()" class="btn btn-secondary" style="font-size: 12px; padding: 6px 12px;">Cambiar</button>
          </div>
        </div>
      `;
    } else {
      let options = `<option value="">-- Selecciona tu taller o departamento --</option>`;
      departments.forEach(d => {
        options += `<option value="${d.id}">${d.name} (Responsable: ${d.leader || 'Sin asignar'})</option>`;
      });

      departmentSection = `
        <div class="card" style="border-left: 4px solid var(--warning);">
          <h3 style="margin-top: 0; color: #854d0e; font-size: 16px;">⚠️ Asignación de Taller o Departamento Obligatoria</h3>
          <p style="font-size: 14px; color: var(--muted); margin-bottom: 15px;">Para que tus evaluaciones anónimas se agrupen correctamente, selecciona tu área de trabajo:</p>
          <div class="form-group">
            <select id="userDeptSelect">${options}</select>
          </div>
          <button onclick="saveUserDepartment()" class="btn">Guardar mi Departamento</button>
        </div>
      `;
    }

    if (!data) {
      app.innerHTML = `
        <div class="card">
          <div class="header">
            <h2>Mi Panel NOM-035</h2>
            <button id="logoutBtn" class="btn btn-secondary">Cerrar Sesión</button>
          </div>
          ${departmentSection}
          <p style="color: var(--muted); margin-bottom: 20px;">Aún no has realizado la evaluación psicosocial obligatoria.</p>
          <a href="quiz.html" class="btn">Realizar Cuestionario (Guía III)</a>
        </div>
      `;
      setupLogout();
      return;
    }

    let domainsHtml = '';
    const domains = data.domainScores || {};
    for (const [domainName, val] of Object.entries(domains)) {
      const score = typeof val === 'object' && val !== null ? val.score : val;
      const risk = typeof val === 'object' && val !== null ? val.risk : '';
      const css = typeof val === 'object' && val !== null ? val.css : 'blue';

      domainsHtml += `
        <div class="list-item">
          <span>${domainName}</span>
          <div style="display: flex; align-items: center; gap: 12px;">
            ${risk ? `<span class="badge badge-${css}">${risk}</span>` : ''}
            <strong>${score} pts</strong>
          </div>
        </div>
      `;
    }

    let categoriesHtml = '';
    const categories = data.categoryScores || data.category_scores || {};
    for (const [catName, val] of Object.entries(categories)) {
      const score = typeof val === 'object' && val !== null ? val.score : val;
      const risk = typeof val === 'object' && val !== null ? val.risk : '';
      const css = typeof val === 'object' && val !== null ? val.css : 'blue';

      categoriesHtml += `
        <div class="list-item">
          <span>${catName}</span>
          <div style="display: flex; align-items: center; gap: 12px;">
            ${risk ? `<span class="badge badge-${css}">${risk}</span>` : ''}
            <strong>${score} pts</strong>
          </div>
        </div>
      `;
    }

    app.innerHTML = `
      <div class="card">
        <div class="header">
          <div>
            <h2>Panel de Resultados - NOM-035</h2>
            <p style="margin: 5px 0 0 0; color: var(--muted); font-size: 14px;">${user.email}</p>
          </div>
          <button id="logoutBtn" class="btn btn-secondary">Cerrar Sesión</button>
        </div>

        ${departmentSection}

        <div class="summary-grid">
          <div class="metric-card">
            <h4>Puntuación Global</h4>
            <div class="metric-value">${data.totalScore || data.total_score}</div>
          </div>
          <div class="metric-card">
            <h4>Nivel de Riesgo Global</h4>
            <div class="metric-value" style="color: var(--accent);">${data.globalRisk || data.global_risk || 'Calculado'}</div>
          </div>
          <div class="metric-card">
            <h4>Estado de Validez</h4>
            <div class="metric-value" style="font-size: 16px; margin-top: 5px;">${data.validityStatus || 'Válido'}</div>
          </div>
        </div>

        <div class="section-title">Resultados por Categorías Oficiales</div>
        <div class="list-group" style="margin-bottom: 25px;">
          ${categoriesHtml || '<p style="color:var(--muted)">Sin datos de categorías</p>'}
        </div>

        <div class="section-title">Resultados detallados por Dominios</div>
        <div class="list-group">
          ${domainsHtml || '<p style="color:var(--muted)">Sin datos de dominios</p>'}
        </div>
      </div>
    `;

    setupLogout();
  }

  window.saveUserDepartment = async function() {
    const deptId = document.getElementById('userDeptSelect').value;
    if (!deptId) {
      alert('Por favor selecciona un departamento o taller.');
      return;
    }

    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return;

    const { error } = await supabase
      .from('nom035_profiles')
      .upsert({ user_id: session.user.id, department_id: deptId }, { onConflict: 'user_id' });

    if (error) {
      alert('Error al guardar el departamento: ' + error.message);
      return;
    }

    location.reload();
  };

  window.showDepartmentSelector = async function() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return;

    await supabase
      .from('nom035_profiles')
      .delete()
      .eq('user_id', session.user.id);

    location.reload();
  };

  function setupLogout() {
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      sessionStorage.clear();
      window.location.href = 'auth.html';
    });
  }

  initDashboard();
</script>

</body>
</html>
