<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluación complementaria de recursos</title>
  <style>
    :root { --bg:#f8fafc; --card:#fff; --text:#1e293b; --muted:#64748b; --accent:#2563eb; --border:#e2e8f0; --warning:#b45309; --danger:#b91c1c; --success:#047857; }
    * { box-sizing:border-box; }
    body { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); margin:0; padding:20px; min-height:100vh; }
    .shell { width:100%; max-width:780px; margin:0 auto; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
    .back { color:#475569; text-decoration:none; font-weight:650; font-size:14px; }
    .lang { border:1px solid var(--border); background:#fff; color:var(--text); border-radius:9px; padding:8px 12px; font-weight:700; cursor:pointer; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:0 4px 20px rgba(15,23,42,.06); padding:34px; }
    h1,h2,h3 { color:#0f172a; }
    h1 { font-size:25px; margin:0 0 10px; }
    p { color:var(--muted); line-height:1.6; }
    .meta { display:flex; flex-wrap:wrap; gap:8px; margin:18px 0; }
    .chip { background:#eff6ff; color:#1d4ed8; border-radius:999px; padding:6px 10px; font-size:12px; font-weight:700; }
    .consent { max-height:300px; overflow:auto; border:1px solid var(--border); background:#f8fafc; padding:18px; border-radius:12px; white-space:pre-wrap; color:#334155; line-height:1.6; }
    .check { display:flex; align-items:flex-start; gap:10px; margin:18px 0; color:#334155; line-height:1.45; }
    .check input { margin-top:4px; accent-color:var(--accent); }
    .btnrow { display:flex; gap:12px; justify-content:space-between; margin-top:24px; }
    .btn { border:0; border-radius:10px; padding:12px 20px; background:var(--accent); color:#fff; font-weight:750; cursor:pointer; text-decoration:none; text-align:center; }
    .btn:hover { background:#1d4ed8; }
    .btn:disabled { background:#cbd5e1; cursor:not-allowed; }
    .btn.secondary { background:#64748b; }
    .progress { width:100%; height:7px; background:#e2e8f0; border-radius:99px; overflow:hidden; margin-bottom:22px; }
    .progress > div { height:100%; background:var(--accent); transition:width .2s; }
    .counter { color:var(--muted); text-transform:uppercase; font-size:12px; font-weight:750; letter-spacing:.05em; }
    .code { color:#94a3b8; font-size:12px; margin-left:8px; }
    .question { font-size:19px; line-height:1.5; margin:10px 0 22px; }
    .options { display:flex; flex-direction:column; gap:10px; }
    .option { display:flex; align-items:flex-start; gap:12px; padding:13px 15px; border:1px solid var(--border); border-radius:11px; cursor:pointer; line-height:1.42; }
    .option:hover,.option.selected { border-color:var(--accent); background:#eff6ff; }
    .option input { margin-top:3px; accent-color:var(--accent); }
    .number { width:100%; padding:13px 15px; border:1px solid var(--border); border-radius:10px; font-size:16px; }
    .help { font-size:13px; color:var(--muted); margin-top:8px; }
    .alert { border-radius:12px; padding:16px; margin:18px 0; line-height:1.5; }
    .alert.error { color:#991b1b; background:#fef2f2; border:1px solid #fecaca; }
    .alert.safety { color:#7f1d1d; background:#fff7ed; border:2px solid #fb923c; }
    .alert.safety a { color:#9a3412; font-weight:800; }
    .loader { text-align:center; padding:50px; color:var(--muted); font-weight:700; }
    footer { text-align:center; color:#94a3b8; font-size:12px; margin:22px 0 4px; }
    @media (max-width:600px) { .card{padding:22px}.btnrow{flex-direction:column-reverse}.btn{width:100%} }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <a class="back" href="index.html" id="backLink">← Volver al panel</a>
      <button class="lang" id="languageButton" type="button">🇲🇽 ES / 🇺🇸 EN</button>
    </div>
    <section class="card" id="app"><div class="loader">Verificando la sesión…</div></section>
    <footer>CRM Sharks &amp; Ray · Health Model Research</footer>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    import { buildQuestionnaireSnapshot, calculateHealthResources } from './health_resources_model.js';

    const supabase = createClient(
      'https://hjmmphkxbnuxnpcbawpg.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqbW1waGt4Ym51eG5wY2Jhd3BnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNDgzNjQsImV4cCI6MjEwMTYyNDM2NH0.bCfCDKS1CT7lNCuJI-Vn4gQd-VbFpcEXVj5WfU3ZpNU'
    );
    const app = document.getElementById('app');
    const languageButton = document.getElementById('languageButton');
    let language = localStorage.getItem('health_resources_language') === 'en-US' ? 'en-US' : 'es-MX';
    let snapshot = buildQuestionnaireSnapshot(language);
    let user = null;
    let sessionId = null;
    let currentIndex = 0;
    let answers = {};
    let responseMeta = {};
    let questionPresentedAt = null;

    const ui = {
      'es-MX': {
        back:'← Volver al panel', loading:'Verificando la sesión…', restricted:'Acceso restringido',
        loginText:'Inicie sesión para realizar la evaluación complementaria de forma confidencial.', login:'Iniciar sesión',
        title:'Evaluación complementaria de recursos', intro:'Este protocolo registrado contiene 70 preguntas del catálogo de Health Model. Evalúa recursos, recuperación, dinámica y marcadores; no modifica la puntuación oficial NOM-035.',
        questions:'70 preguntas', time:'Referencia temporal: últimas 2–4 semanas y estado actual', research:'Instrumento de investigación en validación',
        consentAccept:'He leído el consentimiento y acepto participar en esta sesión.', start:'Aceptar e iniciar sesión',
        resume:'Continuar sesión iniciada', resumeText:'Existe una sesión sin finalizar. Puede continuarla sin firmar un consentimiento nuevo porque sigue siendo la misma sesión.',
        question:'Pregunta', of:'de', previous:'Anterior', next:'Siguiente', finish:'Finalizar y guardar', select:'Seleccione una respuesta para continuar.',
        numberHelp:'Ingrese un valor numérico', unknown:'No tengo datos', saving:'Guardando respuesta…', completing:'Calculando y guardando el resultado…',
        loadError:'No se pudo cargar el módulo', retry:'Volver a intentar',
        safetyTitle:'Su seguridad importa', safetyText:'Su respuesta indica que podría ser útil recibir apoyo humano ahora. Este mensaje no es un diagnóstico y su respuesta individual no se mostrará al empleador.',
        urgent:'Si existe peligro inmediato, llame al 911. También puede comunicarse con Línea de la Vida al 800 911 2000, disponible en México.',
        support:'Abrir Línea de la Vida', continue:'Continuar con la evaluación'
      },
      'en-US': {
        back:'← Back to dashboard', loading:'Verifying session…', restricted:'Restricted access',
        loginText:'Sign in to complete the complementary assessment confidentially.', login:'Sign in',
        title:'Complementary resource assessment', intro:'This registered protocol contains 70 questions from the Health Model catalog. It assesses resources, recovery, dynamics, and markers; it does not change the official NOM-035 score.',
        questions:'70 questions', time:'Time reference: the past 2–4 weeks and current state', research:'Research instrument under validation',
        consentAccept:'I have read the consent and agree to participate in this session.', start:'Accept and start session',
        resume:'Continue existing session', resumeText:'An unfinished session exists. You may continue it without signing a new consent because it is the same session.',
        question:'Question', of:'of', previous:'Previous', next:'Next', finish:'Finish and save', select:'Select an answer to continue.',
        numberHelp:'Enter a numeric value', unknown:'I do not have data', saving:'Saving response…', completing:'Calculating and saving the result…',
        loadError:'The module could not be loaded', retry:'Try again',
        safetyTitle:'Your safety matters', safetyText:'Your response indicates that human support may be helpful now. This message is not a diagnosis, and your individual response will not be shown to the employer.',
        urgent:'If there is immediate danger, call 911. In Mexico, you can also contact Línea de la Vida at 800 911 2000.',
        support:'Open Línea de la Vida', continue:'Continue assessment'
      }
    };

    const t = () => ui[language];
    const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const timezone = () => Intl.DateTimeFormat().resolvedOptions().timeZone || null;
    const utcOffset = () => -new Date().getTimezoneOffset();

    function applyLanguageChrome() {
      document.documentElement.lang = language;
      document.getElementById('backLink').textContent = t().back;
      languageButton.textContent = language === 'es-MX' ? '🇲🇽 ES / 🇺🇸 EN' : '🇺🇸 EN / 🇲🇽 ES';
      snapshot = buildQuestionnaireSnapshot(language);
    }

    languageButton.addEventListener('click', () => {
      if (sessionId) return;
      language = language === 'es-MX' ? 'en-US' : 'es-MX';
      localStorage.setItem('health_resources_language', language);
      applyLanguageChrome();
      showConsent().catch(showError);
    });

    async function initialize() {
      applyLanguageChrome();
      const { data: { session }, error } = await supabase.auth.getSession();
      if (error) throw error;
      if (!session) {
        app.innerHTML = `<h2>${t().restricted}</h2><p>${t().loginText}</p><div class="btnrow"><a class="btn secondary" href="index.html">${t().back.replace('← ','')}</a><a class="btn" href="auth.html">${t().login}</a></div>`;
        return;
      }
      user = session.user;
      const { data: openSessions, error: openError } = await supabase.from('health_resource_sessions')
        .select('session_id,language,started_at').eq('status','in_progress').order('started_at',{ascending:false}).limit(1);
      if (openError) throw openError;
      if (openSessions?.length) return showResume(openSessions[0]);
      await showConsent();
    }

    function showResume(openSession) {
      app.innerHTML = `<h1>${t().resume}</h1><p>${t().resumeText}</p><div class="btnrow"><a href="index.html" class="btn secondary">${t().back.replace('← ','')}</a><button id="resumeButton" class="btn">${t().resume}</button></div>`;
      document.getElementById('resumeButton').addEventListener('click', async () => {
        sessionId = openSession.session_id;
        language = openSession.language;
        applyLanguageChrome();
        languageButton.disabled = true;
        const { data, error } = await supabase.from('health_resource_responses').select('code,answer_value,response_status,presented_at,answered_at').eq('session_id',sessionId);
        if (error) return showError(error);
        for (const row of data || []) {
          answers[row.code] = row.response_status === 'unknown' ? null : Number(row.answer_value);
          responseMeta[row.code] = row;
        }
        const firstMissing = snapshot.questions.findIndex((question) => answers[question.code] === undefined);
        currentIndex = firstMissing < 0 ? snapshot.questions.length - 1 : firstMissing;
        renderQuestion();
      });
    }

    async function showConsent() {
      const { data, error } = await supabase.from('health_resource_consent_versions').select('*').eq('status','active').order('version',{ascending:false}).limit(1).single();
      if (error) throw error;
      const title = language === 'en-US' ? data.title_en : data.title_es;
      const text = language === 'en-US' ? data.text_en : data.text_es;
      app.innerHTML = `
        <h1>${t().title}</h1><p>${t().intro}</p>
        <div class="meta"><span class="chip">${t().questions}</span><span class="chip">${t().time}</span><span class="chip">${t().research}</span></div>
        <h3>${escapeHtml(title)}</h3><div class="consent">${escapeHtml(text)}</div>
        <label class="check"><input id="consentCheck" type="checkbox"><span>${t().consentAccept}</span></label>
        <div class="btnrow"><a class="btn secondary" href="index.html">${t().back.replace('← ','')}</a><button class="btn" id="startButton" disabled>${t().start}</button></div>`;
      const check = document.getElementById('consentCheck');
      const start = document.getElementById('startButton');
      check.addEventListener('change', () => { start.disabled = !check.checked; });
      start.addEventListener('click', startSession);
    }

    async function startSession() {
      const start = document.getElementById('startButton');
      start.disabled = true;
      const nom = JSON.parse(sessionStorage.getItem('nom035_last_result') || 'null');
      const { data, error } = await supabase.rpc('start_health_resource_session', {
        p_language: language,
        p_client_time_zone: timezone(),
        p_client_utc_offset_minutes: utcOffset(),
        p_nom035_result_reference: nom?.resultId ? String(nom.resultId) : null
      });
      if (error) return showError(error);
      sessionId = data;
      languageButton.disabled = true;
      currentIndex = 0;
      answers = {};
      responseMeta = {};
      renderQuestion();
    }

    function renderQuestion() {
      const question = snapshot.questions[currentIndex];
      questionPresentedAt = new Date().toISOString();
      const progress = ((currentIndex + 1) / snapshot.questions.length) * 100;
      let inputHtml = '';
      if (question.type === 'single_select') {
        inputHtml = `<div class="options">${question.options.map((option) => `<label class="option ${answers[question.code] === option.value ? 'selected' : ''}"><input type="radio" name="answer" value="${option.value}" ${answers[question.code] === option.value ? 'checked' : ''}><span>${escapeHtml(option.text)}</span></label>`).join('')}</div>`;
      } else {
        const value = answers[question.code];
        const c = question.constraints || {};
        inputHtml = `<input id="numericAnswer" class="number" type="number" inputmode="decimal" min="${c.min ?? ''}" max="${c.max ?? ''}" step="${c.step ?? 'any'}" value="${typeof value === 'number' ? value : ''}" placeholder="${t().numberHelp} (${escapeHtml(question.unit || '')})"><div class="help">${t().numberHelp} · ${escapeHtml(question.unit || '')}</div>${c.unknownAllowed ? `<label class="check"><input id="unknownAnswer" type="checkbox" ${value === null ? 'checked' : ''}><span>${t().unknown}</span></label>` : ''}`;
      }
      app.innerHTML = `<div class="progress"><div style="width:${progress}%"></div></div><div class="counter">${t().question} ${currentIndex + 1} ${t().of} ${snapshot.questions.length}<span class="code">${question.code}</span></div><h2 class="question">${escapeHtml(question.prompt)}</h2>${inputHtml}<div id="inlineMessage"></div><div class="btnrow"><button class="btn secondary" id="previousButton" ${currentIndex === 0 ? 'disabled' : ''}>${t().previous}</button><button class="btn" id="nextButton">${currentIndex === snapshot.questions.length - 1 ? t().finish : t().next}</button></div>`;
      document.querySelectorAll('input[name="answer"]').forEach((input) => input.addEventListener('change', () => {
        answers[question.code] = Number(input.value);
        document.querySelectorAll('.option').forEach((label) => label.classList.toggle('selected', label.contains(input)));
        showSafetyIfNeeded(question.code, answers[question.code]);
      }));
      document.getElementById('unknownAnswer')?.addEventListener('change', (event) => {
        const numeric = document.getElementById('numericAnswer');
        numeric.disabled = event.target.checked;
        if (event.target.checked) { numeric.value = ''; answers[question.code] = null; }
        else delete answers[question.code];
      });
      const numeric = document.getElementById('numericAnswer');
      if (numeric && answers[question.code] === null) numeric.disabled = true;
      numeric?.addEventListener('input', () => { if (numeric.value !== '') answers[question.code] = Number(numeric.value); else delete answers[question.code]; });
      document.getElementById('previousButton').addEventListener('click', () => { if (currentIndex > 0) { currentIndex -= 1; renderQuestion(); } });
      document.getElementById('nextButton').addEventListener('click', saveAndAdvance);
    }

    function showSafetyIfNeeded(code, value) {
      const show = (code === 'K23' && value >= 1) || (code === 'K24' && value >= 2);
      if (!show) return;
      document.getElementById('inlineMessage').innerHTML = `<div class="alert safety"><strong>${t().safetyTitle}</strong><br>${t().safetyText}<br><br>${t().urgent}<br><a href="https://www.gob.mx/lineadelavida" target="_blank" rel="noopener noreferrer">${t().support}</a></div>`;
    }

    async function saveAndAdvance() {
      const question = snapshot.questions[currentIndex];
      const value = answers[question.code];
      if (value === undefined || (typeof value === 'number' && !Number.isFinite(value))) {
        document.getElementById('inlineMessage').innerHTML = `<div class="alert error">${t().select}</div>`;
        return;
      }
      const button = document.getElementById('nextButton');
      button.disabled = true;
      button.textContent = t().saving;
      const answeredAt = new Date().toISOString();
      const { error } = await supabase.rpc('save_health_resource_response', {
        p_session_id: sessionId, p_code: question.code,
        p_response_status: value === null ? 'unknown' : 'answered', p_answer_value: value,
        p_presented_at: responseMeta[question.code]?.presented_at || questionPresentedAt,
        p_answered_at: answeredAt, p_client_time_zone: timezone(), p_client_utc_offset_minutes: utcOffset()
      });
      if (error) return showError(error);
      responseMeta[question.code] = { presented_at: responseMeta[question.code]?.presented_at || questionPresentedAt, answered_at: answeredAt };
      if (currentIndex < snapshot.questions.length - 1) { currentIndex += 1; renderQuestion(); return; }
      await completeSession();
    }

    async function completeSession() {
      app.innerHTML = `<div class="loader">${t().completing}</div>`;
      const localResult = calculateHealthResources(answers);
      const { data: resultId, error } = await supabase.rpc('complete_health_resource_session', { p_session_id: sessionId });
      if (error) return showError(error);
      const safeResult = {
        resultId, sessionId, language,
        resourceScores: localResult.resourceScores,
        resourceDeficits: localResult.resourceDeficits,
        blockComparisons: localResult.blockComparisons,
        recoverySignal: localResult.recoverySignal,
        expectationSignal: localResult.expectationSignal,
        readinessStatus: localResult.readinessStatus,
        forecastAllowed: false,
        diagnosisProvided: false
      };
      sessionStorage.setItem('health_resources_last_result', JSON.stringify(safeResult));
      sessionStorage.removeItem('health_resources_answers');
      window.location.href = 'health_resources_results.html';
    }

    function showError(error) {
      console.error(error);
      app.innerHTML = `<h2>${t().loadError}</h2><div class="alert error">${escapeHtml(error?.message || String(error))}</div><div class="btnrow"><a class="btn secondary" href="index.html">${t().back.replace('← ','')}</a><button class="btn" id="retryButton">${t().retry}</button></div>`;
      document.getElementById('retryButton').addEventListener('click', () => location.reload());
    }

    initialize().catch(showError);
  </script>
</body>
</html>
