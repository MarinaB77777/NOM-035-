<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Mapa integrado de evidencias</title>
  <style>
    :root{--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#f8fafc;--muted:#94a3b8;--blue:#3b82f6;--green:#10b981;--orange:#f97316}
    *{box-sizing:border-box}body{margin:0;padding:28px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:1100px;margin:auto}
    header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:24px}h1{margin:0 0 8px;font-size:27px}p{color:var(--muted);line-height:1.55;margin:0}.btn{background:#475569;color:#fff;text-decoration:none;padding:10px 15px;border-radius:9px;font-weight:700;white-space:nowrap}
    .legend{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}.legend span{font-size:12px;border:1px solid var(--border);border-radius:999px;padding:6px 10px;color:#cbd5e1}.matrix{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}.block{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px}.block h2{font-size:18px;margin:0 0 15px}.channels{display:grid;grid-template-columns:1fr 1fr;gap:10px}.channel{background:#162033;border-radius:10px;padding:12px}.channel label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:800;margin-bottom:5px}.value{font-size:20px;font-weight:800}.status{margin-top:12px;padding:9px 11px;border-radius:9px;background:#334155;font-size:12px;font-weight:750}.status.MISMATCH_SIGNAL{background:#7c2d12;color:#fed7aa}.status.CONCORDANT{background:#064e3b;color:#a7f3d0}.nom{margin-top:12px;color:#cbd5e1;font-size:13px;line-height:1.5}.nom strong{color:#93c5fd}.method{margin-top:24px;background:#172033;border:1px solid var(--border);border-radius:14px;padding:20px}.empty{background:var(--surface);border-radius:14px;padding:28px}.actions{display:flex;gap:12px;margin-top:20px}@media(max-width:600px){body{padding:18px}header{flex-direction:column}.channels{grid-template-columns:1fr}}
  </style>
</head>
<body><main class="shell" id="app"></main><script type="module">
    import { HEALTH_EVIDENCE_BLOCKS } from './health_resources_model.js';
    const app=document.getElementById('app');
    const health=JSON.parse(sessionStorage.getItem('health_resources_last_result')||'null');
    const nom=JSON.parse(sessionStorage.getItem('nom035_last_result')||'null');
    const lang=health?.language==='en-US'?'en-US':'es-MX';document.documentElement.lang=lang;
    const t=lang==='en-US'?{title:'Integrated evidence map',sub:'Same-area conclusions are compared by block; NOM-035 and Health Model scales remain separate.',back:'Back to dashboard',resource:'Resource',marker:'Markers',nom:'Related NOM-035 domains',none:'No direct NOM-035 counterpart',missing:'Complete the complementary resource assessment to build the evidence map.',open:'Open resource assessment',method:'Interpretation boundary',methodText:'A mismatch is a research signal between channels in the same area. Sensor indicators require the same person’s baseline. Cross-instrument relationships are hypotheses for sample-level analysis, not an individual diagnosis.',CONCORDANT:'Concordant',ADJACENT:'Adjacent',MISMATCH_SIGNAL:'Mismatch signal',INSUFFICIENT_DATA:'Insufficient data'}:{title:'Mapa integrado de evidencias',sub:'Las conclusiones de la misma área se comparan por bloques; las escalas NOM-035 y Health Model permanecen separadas.',back:'Volver al panel',resource:'Recurso',marker:'Marcadores',nom:'Dominios NOM-035 relacionados',none:'Sin contraparte directa en NOM-035',missing:'Complete la evaluación complementaria de recursos para construir el mapa de evidencias.',open:'Abrir evaluación de recursos',method:'Límite de interpretación',methodText:'Una discrepancia es una señal de investigación entre canales de la misma área. Los indicadores de sensores requieren la línea base de la misma persona. Las relaciones entre instrumentos son hipótesis para análisis a nivel de muestra, no un diagnóstico individual.',CONCORDANT:'Concordante',ADJACENT:'Adyacente',MISMATCH_SIGNAL:'Señal de discrepancia',INSUFFICIENT_DATA:'Datos insuficientes'};
    const names=lang==='en-US'?{physical:'Physical',psychological:'Psychological',goal:'Goals',social:'Social',financial:'Financial',spiritual:'Values and integrity'}:{physical:'Físico',psychological:'Psicológico',goal:'Metas',social:'Social',financial:'Financiero',spiritual:'Valores e integridad'};
    const nomNames={1:'Condiciones en el ambiente de trabajo',2:'Carga de trabajo',3:'Falta de control sobre el trabajo',4:'Jornada de trabajo',5:'Interferencia trabajo-familia',6:'Liderazgo',7:'Relaciones en el trabajo',8:'Violencia laboral',9:'Reconocimiento del desempeño',10:'Pertenencia e inestabilidad'};
    const esc=v=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    if(!health){app.innerHTML=`<header><div><h1>${t.title}</h1><p>${t.missing}</p></div><a class="btn" href="index.html">${t.back}</a></header><div class="empty"><a class="btn" href="extra_survey.html">${t.open}</a></div>`;}else{
      const comparisons=new Map((health.blockComparisons||[]).map(item=>[item.block,item]));
      const scoreKeys={physical:'r_phys',psychological:'r_psych',goal:'r_goal',social:'r_social',financial:'r_fin',spiritual:'r_spiritual'};
      const cards=HEALTH_EVIDENCE_BLOCKS.map(block=>{const c=comparisons.get(block.code)||{};const rs=health.resourceScores?.[scoreKeys[block.code]];const relevant=block.nom035Domains.map(id=>{const entry=Object.entries(nom?.domainScores||{}).find(([,value])=>Number(value?.id)===id);return entry?`${entry[0]}: ${entry[1].risk||entry[1].score}`:nomNames[id]}).filter(Boolean);return `<article class="block"><h2>${esc(names[block.code])}</h2><div class="channels"><div class="channel"><label>${t.resource}</label><div class="value">${Number.isFinite(Number(rs))?Number(rs).toFixed(0)+' / 100':'—'}</div></div><div class="channel"><label>${t.marker}</label><div class="value">${typeof c.markerSeverity==='number'?c.markerSeverity.toFixed(2)+' / 5':'—'}</div></div></div><div class="status ${esc(c.concordance||'INSUFFICIENT_DATA')}">${esc(t[c.concordance]||t.INSUFFICIENT_DATA)}</div><div class="nom"><strong>${t.nom}:</strong><br>${relevant.length?relevant.map(esc).join('<br>'):t.none}</div></article>`}).join('');
      app.innerHTML=`<header><div><h1>${t.title}</h1><p>${t.sub}</p></div><a class="btn" href="index.html">${t.back}</a></header><div class="legend"><span>Health Model: 70</span><span>NOM-035: ${nom?'✓':'—'}</span><span>Unknown ≠ 0</span></div><section class="matrix">${cards}</section><section class="method"><h2>${t.method}</h2><p>${t.methodText}</p></section><div class="actions"><a class="btn" href="ai_analyst.html">AI</a><a class="btn" href="health_resources_results.html">Health Model</a></div>`;
    }
  </script></body></html>
