<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Extractor y Validador NOM-035 (Guía III)</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --accent: #3b82f6; --error: #ef4444; --success: #10b981; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 30px; margin: 0; }
    .container { max-width: 900px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 14px; border: 1px solid #334155; }
    h1 { margin-top: 0; font-size: 22px; color: #f1f5f9; }
    p { color: var(--muted); font-size: 14px; }
    textarea { width: 100%; height: 220px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #34d399; padding: 12px; font-family: monospace; font-size: 13px; resize: vertical; box-sizing: border-box; margin-top: 10px; }
    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    button { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }
    button:hover { background: #2563eb; }
    button.secondary { background: #475569; }
    button.secondary:hover { background: #334155; }
    .alert { padding: 12px; border-radius: 8px; margin-top: 15px; font-size: 13px; display: none; }
    .alert.error { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--error); color: #fca5a5; }
    .alert.success { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); color: #6ee7b7; }
    pre { background: #0f172a; border: 1px solid #334155; padding: 16px; border-radius: 8px; overflow-x: auto; max-height: 400px; margin-top: 20px; font-size: 12px; color: #34d399; }
  </style>
</head>
<body>

<div class="container">
  <h1>🛠 Admin Panel: Procesamiento y Validación Guía III (NOM-035)</h1>
  <p>Herramienta exclusiva para administradores. Pega el texto bruto para validar la jerarquía oficial y exportar el JSON de 72 reactivos.</p>
  
  <textarea id="rawInput" placeholder="Pega aquí el texto con formato * G3-Q..."></textarea>
  
  <div class="btn-group">
    <button onclick="processAndValidate()">Validar y Generar JSON Oficial</button>
    <button class="secondary" onclick="document.getElementById('rawInput').value=''">Limpiar</button>
  </div>

  <div id="alertBox" class="alert"></div>

  <div id="outputSection" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 25px;">
      <h3 style="margin: 0; font-size: 16px;">Base de Datos Estructurada</h3>
      <button style="padding: 8px 14px; background: var(--success);" onclick="copyJSON()">📋 Copiar JSON</button>
    </div>
    <pre id="jsonOutput"></pre>
  </div>
</div>

<footer style="text-align: center; margin-top: 40px; color: var(--muted); font-size: 13px;">
  CRM Sharks + Gemini + ЗДЕСЬ МОЖЕТ БЫТЬ ВАШ УНИВЕРСИТЕТ
</footer>

<script>
  // Официальное дерево соответствия Категорий и Доменов (Guía III)
  function getOfficialDomainAndCategory(rawCategory) {
    const map = {
      "Condiciones en el ambiente de trabajo": { category: "Condiciones en el ambiente de trabajo", domain: "Condiciones en el ambiente de trabajo" },
      "Carga de trabajo": { category: "Factores propios de la actividad", domain: "Carga de trabajo" },
      "Falta de control sobre el trabajo": { category: "Factores propios de la actividad", domain: "Falta de control sobre el trabajo" },
      "Jornada de trabajo": { category: "Organización del tiempo de trabajo", domain: "Jornada de trabajo" },
      "Interferencia en la relación trabajo-familia": { category: "Organización del tiempo de trabajo", domain: "Interferencia en la relación trabajo-familia" },
      "Liderazgo": { category: "Liderazgo y relaciones en el trabajo", domain: "Liderazgo" },
      "Relaciones en el trabajo": { category: "Liderazgo y relaciones en el trabajo", domain: "Relaciones en el trabajo" },
      "Violencia laboral": { category: "Liderazgo y relaciones en el trabajo", domain: "Violencia laboral" },
      "Violencia": { category: "Liderazgo y relaciones en el trabajo", domain: "Violencia laboral" },
      "Reconocimiento del desempeño": { category: "Entorno organizacional", domain: "Reconocimiento del desempeño" },
      "Escasa evaluación y reconocimiento del desempeño": { category: "Entorno organizacional", domain: "Reconocimiento del desempeño" },
      "Insuficiente sentido de pertenencia e inestabilidad": { category: "Entorno organizacional", domain: "Insuficiente sentido de pertenencia e inestabilidad" },
      "Sentido de pertenencia e inestabilidad": { category: "Entorno organizacional", domain: "Insuficiente sentido de pertenencia e inestabilidad" },
      "Atención a clientes y usuarios": { category: "Entorno organizacional", domain: "Atención a clientes y usuarios" }
    };
    return map[rawCategory] || { category: "General", domain: "General" };
  }

  let finalExportString = "";

  function processAndValidate() {
    const rawText = document.getElementById('rawInput').value;
    const alertBox = document.getElementById('alertBox');
    
    if (!rawText.trim()) {
      showAlert("Por favor ingresa texto para procesar.", "error");
      return;
    }

    const blocks = rawText.split(/\*\s*G3-Q/);
    const questions = [];

    for (let i = 1; i < blocks.length; i++) {
      const block = blocks[i];
      const idMatch = block.match(/^0*(\d+)/);
      const textMatch = block.match(/\*\s*(?:Texto|Текст):\s*([^\n\r]+)/i);
      const categoryMatch = block.match(/\*\s*(?:Categoría|Категория):\s*([^\n\r]+)/i);
      const typeMatch = block.match(/\*\s*(?:Tipo de pregunta|Тип вопроса):\s*([^\n\r]+)/i);
      const scoresMatch = block.match(/\*\s*(?:Puntuación|Баллы):\s*([^\n\r]+)/i);

      if (idMatch && textMatch) {
        const id = parseInt(idMatch[1], 10);
        const rawCat = categoryMatch ? categoryMatch[1].trim() : "";
        const hierarchy = getOfficialDomainAndCategory(rawCat);

        let scoresObj = {};
        if (scoresMatch) {
          scoresMatch[1].split('|').forEach(pair => {
            const [k, v] = pair.split('=');
            if (k && v) scoresObj[k.trim()] = parseInt(v.trim(), 10);
          });
        }

        const typeStr = typeMatch ? typeMatch[1].toLowerCase() : "";
        let isInverse = typeStr.includes('inverso') || typeStr.includes('обратный');

        questions.push({
          id: id,
          code: `NOM_G3_Q${String(id).padStart(2, '0')}`,
          question: textMatch[1].trim(),
          category: hierarchy.category,
          domain: hierarchy.domain,
          inverse: isInverse,
          scores: scoresObj
        });
      }
    }

    questions.sort((a, b) => a.id - b.id);

    // Строгая проверка стандарта: ровно 72 вопроса для Guía III
    if (questions.length !== 72) {
      showAlert(`⚠️ Advertencia de Estándar: Se detectaron ${questions.length} reactivos. La Guía III de la NOM-035 exige exactamente 72 preguntas oficiales.`, "error");
    } else {
      showAlert(`✅ Validación exitosa: Se han verificado exactamente los 72 reactivos oficiales de la Guía III con su árbol jerárquico correcto.`, "success");
    }

    const database = {
      standard: "NOM-035-STPS-2018",
      guide: "Guía de Referencia III",
      totalQuestions: questions.length,
      updatedAt: new Date().toISOString(),
      questions: questions
    };

    finalExportString = JSON.stringify(database, null, 2);
    document.getElementById('jsonOutput').textContent = finalExportString;
    document.getElementById('outputSection').style.display = 'block';
  }

  function showAlert(msg, type) {
    const box = document.getElementById('alertBox');
    box.className = `alert ${type}`;
    box.textContent = msg;
    box.style.display = 'block';
  }

  function copyJSON() {
    navigator.clipboard.writeText(finalExportString).then(() => {
      alert("¡JSON oficial copiado al portapapeles!");
    });
  }
</script>

</body>
</html>
