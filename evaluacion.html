<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluación NOM-035 - Guía III</title>
  <style>
    :root { --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --muted: #64748b; --accent: #2563eb; --border: #e2e8f0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 85vh; margin: 0; }
    .container { width: 100%; max-width: 750px; background: var(--card); padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid var(--border); }
    
    .progress-bar { width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; margin-bottom: 25px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }
    
    .question-counter { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
    h3 { font-size: 18px; color: #0f172a; margin-top: 0; margin-bottom: 20px; line-height: 1.5; }
    
    .options-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
    .option-label { display: flex; align-items: center; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.2s; font-size: 15px; }
    .option-label:hover { background: #f8fafc; border-color: var(--accent); }
    .option-label input { margin-right: 12px; accent-color: var(--accent); }

    .btn-group { display: flex; justify-content: space-between; align-items: center; }
    .btn { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s; text-decoration: none; display: inline-block; text-align: center; }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }
    
    .loader { text-align: center; font-weight: bold; color: var(--muted); padding: 40px; }
  </style>
</head>
<body>

<div class="container" id="quizApp">
  <div class="loader">Verificando sesión...</div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

  const supabase = createClient(
    'https://hjmmphkxbnuxnpcbawpg.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqbW1waGt4Ym51eG5wY2Jhd3BnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNDgzNjQsImV4cCI6MjEwMTYyNDM2NH0.bCfCDKS1CT7lNCuJI-Vn4gQd-VbFpcEXVj5WfU3ZpNU'
  );

  let currentQuestions = [];
  let currentIndex = 0;
  let userAnswers = {}; 
  let currentUser = null;

  let testStartTime = null;
  let questionStartTimestamp = null;
  let questionTimes = [];

  async function checkAuthAndInit() {
    const { data: { session } } = await supabase.auth.getSession();
    
    if (!session) {
      document.getElementById('quizApp').innerHTML = `
        <h2 style="color: #0f172a; margin-top: 0;">Acceso Restringido</h2>
        <p style="color: var(--muted); line-height: 1.6; margin-bottom: 25px;">
          Para realizar la evaluación NOM-035 de forma confidencial, es necesario iniciar sesión en el sistema.
        </p>
        <div style="display: flex; gap: 15px;">
          <a href="auth.html" class="btn" style="flex: 1;">Iniciar Sesión</a>
          <a href="index.html" class="btn btn-secondary" style="flex: 1;">Ir al Inicio</a>
        </div>
      `;
      return;
    }
    
    currentUser = session.user;
    showWelcomeScreen();
  }

  function showWelcomeScreen() {
    document.getElementById('quizApp').innerHTML = `
      <h2 style="color: #0f172a; margin-top: 0;">Evaluación de Factores de Riesgo Psicosocial (Guía III)</h2>
      <p style="color: var(--muted); line-height: 1.6; margin-bottom: 25px;">
        Está a punto de iniciar el cuestionario oficial <strong>NOM-035-STPS-2018</strong>. Sus respuestas son estrictamente confidenciales. Consta de 72 reactivos y se recomienda completarlo sin interrupciones.
      </p>
      <div style="display: flex; gap: 15px;">
        <button class="btn" id="startQuizBtn" style="flex: 2; padding: 14px;">Comenzar Cuestionario</button>
        <a href="index.html" class="btn btn-secondary" style="flex: 1; padding: 14px; line-height: 1.2;">Regresar</a>
      </div>
    `;

    document.getElementById('startQuizBtn').addEventListener('click', () => {
      testStartTime = Date.now();
      questionStartTimestamp = Date.now();
      initQuiz();
    });
  }

  async function initQuiz() {
    document.getElementById('quizApp').innerHTML = `<div class="loader">Cargando reactivos de la norma...</div>`;
    try {
      const { data, error } = await supabase
        .from('v_nom035_questionnaire_map')
        .select('*')
        .order('question_number', { ascending: true });

      if (error) throw error;

      currentQuestions = data.map(q => ({
        id: q.question_number,
        question: q.question_text,
        category: q.category_name,
        categoryId: q.category_id,
        domain: q.domain_name,
        domainId: q.domain_id,
        inverse: q.is_inverse,
        scores: q.is_inverse ? 
            { "Siempre": 4, "Casi siempre": 3, "Algunas veces": 2, "Casi nunca": 1, "Nunca": 0 } :
            { "Siempre": 0, "Casi siempre": 1, "Algunas veces": 2, "Casi nunca": 3, "Nunca": 4 }
      }));

      renderQuestion();
    } catch (err) {
      document.getElementById('quizApp').innerHTML = `
        <h3 style="color: #991b1b;">Error al cargar el cuestionario</h3>
        <p style="color: #64748b;">No se pudo conectar con Supabase: ${err.message}</p>
        <a href="index.html" class="btn btn-secondary" style="margin-top: 15px;">Volver al Inicio</a>
      `;
      console.error(err);
    }
  }

  function renderQuestion() {
    if (currentIndex >= currentQuestions.length) {
      handleQuizCompletion();
      return;
    }

    const q = currentQuestions[currentIndex];
    const progress = (currentIndex / currentQuestions.length) * 100;
    const selectedVal = userAnswers[q.id] || '';

    let optionsHtml = '';
    for (const optText in q.scores) {
      const checked = selectedVal === optText ? 'checked' : '';
      optionsHtml += `
        <label class="option-label">
          <input type="radio" name="current_option" value="${optText}" ${checked} onchange="window.saveAnswer(${q.id}, '${optText}')">
          ${optText}
        </label>
      `;
    }

    document.getElementById('quizApp').innerHTML = `
      <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
      <div class="question-counter">Pregunta ${currentIndex + 1} de ${currentQuestions.length}</div>
      <h3>${q.question}</h3>
      <div class="options-list">${optionsHtml}</div>
      <div class="btn-group">
        <button class="btn btn-secondary" id="prevBtn" ${currentIndex === 0 ? 'disabled' : ''} onclick="window.prevQuestion()">Anterior</button>
        <button class="btn" id="nextBtn" onclick="window.nextQuestion()">${currentIndex === currentQuestions.length - 1 ? 'Finalizar y Guardar' : 'Siguiente'}</button>
      </div>
    `;
  }

  window.saveAnswer = function(qId, val) {
    userAnswers[qId] = val;
  }

  window.nextQuestion = function() {
    const q = currentQuestions[currentIndex];
    if (!userAnswers[q.id]) {
      alert('Por favor selecciona una opción antes de continuar.');
      return;
    }

    let now = Date.now();
    questionTimes.push((now - questionStartTimestamp) / 1000);
    questionStartTimestamp = now;

    currentIndex++;
    renderQuestion();
  }

  window.prevQuestion = function() {
    if (currentIndex > 0) {
      currentIndex--;
      renderQuestion();
    }
  }

  function evaluateResponseQuality() {
    let totalTimeSec = (Date.now() - testStartTime) / 1000;
    let answersArray = Object.values(userAnswers);
    let totalQuestions = answersArray.length;

    let isSpeeding = totalTimeSec < 180;
    let frequencyMap = {};
    answersArray.forEach(ans => { frequencyMap[ans] = (frequencyMap[ans] || 0) + 1; });
    let maxRepetitions = Math.max(...Object.values(frequencyMap));
    let monotonyPercentage = maxRepetitions / totalQuestions;
    let isMonotonous = monotonyPercentage > 0.85;

    let ultraFastClicks = questionTimes.filter(t => t < 1.0).length;
    let validityStatus = "Válido";
    let diagnosticFlags = [];

    if (isSpeeding) { validityStatus = "Revisión requerida (Tiempo insuficiente)"; diagnosticFlags.push("speeding"); }
    if (isMonotonous) { validityStatus = "No válido (Monotonía de respuestas)"; diagnosticFlags.push("straight_lining"); }
    if (ultraFastClicks > 12) { validityStatus = "Revisión requerida (Clics erráticos)"; diagnosticFlags.push("rapid_clicking"); }

    return {
      totalTimeSeconds: Math.round(totalTimeSec),
      validityStatus: validityStatus,
      flags: diagnosticFlags,
      metrics: { monotonyRate: +(monotonyPercentage * 100).toFixed(1) + "%", fastClicksCount: ultraFastClicks }
    };
  }

  async function handleQuizCompletion() {
    document.getElementById('quizApp').innerHTML = `
      <div class="loader">Procesando dictamen con tablas oficiales y guardando...</div>
    `;

    let totalScore = 0;
    let domainScores = {};
    let categoryScores = {};

    currentQuestions.forEach(q => {
      const ans = userAnswers[q.id];
      const score = q.scores[ans] || 0;
      totalScore += score;
      domainScores[q.domain] = {
        score: (domainScores[q.domain]?.score || 0) + score,
        domainId: q.domainId
      };
      categoryScores[q.category] = {
        score: (categoryScores[q.category]?.score || 0) + score,
        categoryId: q.categoryId
      };
    });

    const qualityCheck = evaluateResponseQuality();

    try {
      const [domainRiskRes, categoryRiskRes, globalRiskRes] = await Promise.all([
        supabase.from('nom035_tabla_4_domain_risk').select('*'),
        supabase.from('nom035_tabla_5_category_risk').select('*'),
        supabase.from('nom035_tabla_6_global_risk').select('*')
      ]);

      if (domainRiskRes.error) throw domainRiskRes.error;
      if (categoryRiskRes.error) throw categoryRiskRes.error;
      if (globalRiskRes.error) throw globalRiskRes.error;

      const domainRules = domainRiskRes.data;
      const categoryRules = categoryRiskRes.data;
      const globalRules = globalRiskRes.data;

      function getRisk(score, rules, idKey, targetId) {
        const numScore = Number(score);
        const numTargetId = Number(targetId);

        const rule = rules.find(r => 
          Number(r[idKey]) === numTargetId && 
          numScore >= Number(r.min_score) && 
          numScore <= Number(r.max_score)
        );
        return rule ? { risk: rule.risk_level, css: rule.css_class } : { risk: "Despreciable", css: "green" };
      }
      
      let evaluatedDomains = {};
      for (const [domainName, data] of Object.entries(domainScores)) {
        const evaluated = getRisk(data.score, domainRules, 'domain_id', data.domainId);
        evaluatedDomains[domainName] = { score: data.score, ...evaluated };
      }

      let evaluatedCategories = {};
      for (const [catName, data] of Object.entries(categoryScores)) {
        const evaluated = getRisk(data.score, categoryRules, 'category_id', data.categoryId);
        evaluatedCategories[catName] = { score: data.score, ...evaluated };
      }

      const globalRule = globalRules.find(r => totalScore >= r.min_score && totalScore <= r.max_score);
      const globalRiskText = globalRule ? globalRule.risk_level : "Bajo";

      const payloadToSupabase = {
        user_id: currentUser ? currentUser.id : null,
        total_score: totalScore,
        global_risk: globalRiskText,
        domain_scores: evaluatedDomains,
        category_scores: evaluatedCategories,
        total_time_seconds: qualityCheck.totalTimeSeconds,
        validity_status: qualityCheck.validityStatus,
        quality_flags: qualityCheck.flags,
        audit_metrics: qualityCheck.metrics,
        created_at: new Date().toISOString()
      };

      await supabase.from('nom035_survey_results').insert([payloadToSupabase]);

      sessionStorage.setItem('nom035_last_result', JSON.stringify({
        totalScore,
        globalRisk: globalRiskText,
        domainScores: evaluatedDomains,
        categoryScores: evaluatedCategories,
        totalTime: qualityCheck.totalTimeSeconds,
        validityStatus: qualityCheck.validityStatus
      }));

    } catch (err) {
      console.error("Error al calcular riesgos con las tablas oficiales:", err.message);
      alert("Hubo un error al procesar las tablas oficiales de riesgo.");
    }

    history.replaceState(null, '', 'dashboard.html');
    window.location.href = 'dashboard.html';
  }

  checkAuthAndInit();
</script>

</body>
</html>
