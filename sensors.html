<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensores y Telemetría - NOM-035</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #ffffff;
      --text: #1e293b;
      --text-light: #64748b;
      --accent: #3b82f6;
      --border: #e2e8f0;
      --radius: 16px;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: var(--text);
      padding: 20px;
      margin: 0;
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 900px; padding-bottom: 40px; }
    .card {
      background: var(--card);
      padding: 30px;
      border-radius: var(--radius);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
    .header h2 { margin: 0; font-size: 22px; font-weight: 800; color: #0f172a; }
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn:hover { background: #2563eb; }
    .btn-secondary { background: #64748b; }
    .status-box { padding: 14px 18px; border-radius: 10px; font-size: 14px; margin-bottom: 15px; background: #f1f5f9; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .status-ok { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
    .status-err { background: #fef2f2; color: #991b1b; border-color: #fecaca; }

    /* Стили для 3 независимых индикаторов */
    .indicators-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    .indicator-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
    }
    .indicator-card h4 {
      margin: 0 0 12px 0;
      font-size: 12px;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .color-square {
      width: 100%;
      height: 70px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      transition: background-color 0.4s ease;
      margin-bottom: 10px;
      background-color: #cbd5e1;
    }
    .indicator-value {
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="header">
      <h2>🛰️ Telemetría y Dispositivos Biométricos</h2>
      <a href="dashboard.html" class="btn btn-secondary">← Volver al Panel</a>
    </div>

    <!-- Статусы подключения -->
    <div id="gpsStatus" class="status-box">📍 Buscando señal GPS local...</div>
    <div id="pulseStatus" class="status-box">❤️ Sensor de pulso Bluetooth desconectado.</div>

    <div style="text-align: center; margin: 25px 0;">
      <button onclick="autoConnectSensors()" class="btn" style="font-size: 16px; padding: 14px 28px;">
        ⚡ Conectar Dispositivos Automáticamente
      </button>
    </div>

    <!-- 3 Индикатора (Зеленый -> Желтый -> Красный) -->
    <div class="indicators-grid">
      <div class="indicator-card">
        <h4>Pulso Cardíaco</h4>
        <div id="squarePulse" class="color-square">--</div>
        <span id="textPulse" class="indicator-value">-- bpm</span>
      </div>

      <div class="indicator-card">
        <h4>Estrés (NOM-035)</h4>
        <div id="squareNom" class="color-square">--</div>
        <span id="textNom" class="indicator-value">-- pts</span>
      </div>

      <div class="indicator-card">
        <h4>Estrés (Modelo Salud)</h4>
        <div id="squareModel" class="color-square">--</div>
        <span id="textModel" class="indicator-value">-- %</span>
      </div>
    </div>

  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

  const supabase = createClient(
    'https://hjmmphkxbnuxnpcbawpg.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqbW1waGt4Ym51eG5wY2Jhd3BnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNDgzNjQsImV4cCI6MjEwMTYyNDM2NH0.bCfCDKS1CT7lNCuJI-Vn4gQd-VbFpcEXVj5WfU3ZpNU'
  );

  let currentPulse = 75;
  let currentNomStress = 30;
  let currentHealthStress = 20;

  async function initTelemetry() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = 'auth.html';
      return;
    }

    const { data: profile } = await supabase.from('profiles').select('current_pulse, health_stress_score').eq('id', session.user.id).maybeSingle();
    const { data: survey } = await supabase.from('survey_results').select('total_score').eq('user_id', session.user.id).order('created_at', { ascending: false }).limit(1).maybeSingle();

    if (profile?.current_pulse) currentPulse = profile.current_pulse;
    if (profile?.health_stress_score) currentHealthStress = profile.health_stress_score;
    if (survey?.total_score) currentNomStress = survey.total_score;

    updateAllIndicators();
    startAutomaticGPS();
  }

  function startAutomaticGPS() {
    const gpsBox = document.getElementById('gpsStatus');
    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        async (position) => {
          const lat = position.coords.latitude.toFixed(4);
          const lon = position.coords.longitude.toFixed(4);
          gpsBox.className = 'status-box status-ok';
          gpsBox.innerHTML = `📍 GPS conectado: Lat ${lat}, Lon ${lon}`;
          
          const { data: { session } } = await supabase.auth.getSession();
          if (session) {
            await supabase.from('profiles').update({ gps_device_id: `GPS-${lat},${lon}` }).eq('id', session.user.id);
          }
        },
        () => {
          gpsBox.className = 'status-box status-err';
          gpsBox.textContent = '⚠️ Señal GPS no disponible.';
        },
        { enableHighAccuracy: true }
      );
    } else {
      gpsBox.className = 'status-box status-err';
      gpsBox.textContent = '❌ Geolocalización no soportada.';
    }
  }

  window.autoConnectSensors = async function() {
    const pulseBox = document.getElementById('pulseStatus');
    try {
      if (!navigator.bluetooth) {
        alert('Web Bluetooth no soportado en este navegador.');
        return;
      }
      pulseBox.textContent = '🔄 Buscando pulصómetro Bluetooth...';
      
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ services: ['heart_rate'] }]
      });

      const server = await device.gatt.connect();
      const service = await server.getPrimaryService('heart_rate');
      const characteristic = await service.getCharacteristic('heart_rate_measurement');

      characteristic.addEventListener('characteristicvaluechanged', async (event) => {
        const value = event.target.value;
        currentPulse = value.getUint8(1);
        updateAllIndicators();

        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
          await supabase.from('profiles').update({ current_pulse: currentPulse, pulse_device_id: device.name || 'BLE-Sensor' }).eq('id', session.user.id);
        }
      });

      await characteristic.startNotifications();
      pulseBox.className = 'status-box status-ok';
      pulseBox.innerHTML = `❤️ Conectado a: <strong>${device.name || 'Sensor'}</strong>`;
    } catch (err) {
      pulseBox.className = 'status-box status-err';
      pulseBox.textContent = '⚠️ No se pudo conectar al pulصómetro.';
    }
  };

  // Функция расчета цвета от зеленого (120) к красному (0)
  function setIndicatorColor(squareId, textId, value, unit, min, max) {
    const square = document.getElementById(squareId);
    const text = document.getElementById(textId);
    if (!square || !text) return;

    const clamped = Math.max(min, Math.min(max, value));
    const ratio = (clamped - min) / (max - min);
    const hue = (1 - ratio) * 120; // 120 = зелёный, 0 = красный

    square.style.backgroundColor = `hsl(${hue}, 85%, 45%)`;
    square.textContent = Math.round(value);
    text.textContent = `${Math.round(value)} ${unit}`;
  }

  function updateAllIndicators() {
    // Пульс: норма 60 (зеленый), тревога 150+ (красный)
    setIndicatorColor('squarePulse', 'textPulse', currentPulse, 'bpm', 60, 150);
    
    // Стресс NOM: норма 0, высокий риск 100+
    setIndicatorColor('squareNom', 'textNom', currentNomStress, 'pts', 0, 100);
    
    // Стресс модели: норма 0%, высокий риск 100%
    setIndicatorColor('squareModel', 'textModel', currentHealthStress, '%', 0, 100);
  }

  initTelemetry();
</script>

</body>
</html>
