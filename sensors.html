<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Usuario - NOM-035 Pro</title>
  <style>
    :root { 
      --bg: #0f172a; 
      --surface: #1e293b; 
      --card: #ffffff; 
      --text: #1e293b; 
      --text-light: #64748b;
      --accent: #3b82f6; 
      --accent-hover: #2563eb;
      --border: #e2e8f0; 
      --success-bg: #f0fdf4;
      --success-text: #166534;
      --warning-bg: #fefce8;
      --warning-text: #854d0e;
      --radius: 16px;
    }
    
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #f8fafc; 
      color: var(--text); 
      padding: 20px; 
      margin: 0; 
      display: flex; 
      justify-content: center; 
    }

    .container { width: 100%; max-width: 1000px; margin-top: 10px; padding-bottom: 60px; }
    
    .card { 
      background: var(--card); 
      padding: 30px; 
      border-radius: var(--radius); 
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); 
      border: 1px solid var(--border); 
      margin-bottom: 24px; 
    }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
    .header h2 { margin: 0; color: #0f172a; font-size: 24px; font-weight: 800; }
    
    .btn { 
      background: var(--accent); 
      color: white; 
      border: none; 
      padding: 12px 24px; 
      border-radius: 10px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 14px; 
      text-decoration: none; 
      transition: all 0.2s ease; 
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-secondary { background: #64748b; box-shadow: none; }
    .btn-secondary:hover { background: #475569; }

    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .metric-card { background: #f8fafc; padding: 22px; border-radius: 14px; border: 1px solid var(--border); text-align: center; position: relative; overflow: hidden; }
    .metric-card::after { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--accent); }
    .metric-card h4 { margin: 0 0 8px 0; color: var(--text-light); font-size: 12px; text-transform: uppercase; }
    .metric-value { font-size: 26px; font-weight: 800; color: #0f172a; }

    .section-title { font-size: 18px; font-weight: 700; color: #0f172a; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    
    .list-group { display: flex; flex-direction: column; gap: 12px; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; font-weight: 500; }
    
    .badge { font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 20px; color: white; text-transform: uppercase; }
    .badge-green { background: #16a34a; }
    .badge-blue { background: #3b82f6; }
    .badge-yellow { background: #ca8a04; color: #fff; }
    .badge-orange { background: #ea580c; }
    .badge-red { background: #dc2626; }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-light); }
    select, input[type="text"] { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; background: white; outline: none; box-sizing: border-box; }
    select:focus, input[type="text"]:focus { border-color: var(--accent); }

    .chat-container { background: #1e293b; color: #f8fafc; border-radius: var(--radius); padding: 24px; margin-top: 24px; }
    .chat-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; font-weight: 700; font-size: 16px; color: #38bdf8; }
    .chat-messages { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; padding-right: 5px; }
    .chat-msg { padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.4; max-width: 85%; }
    .chat-msg.ai { background: #334155; color: #e2e8f0; align-self: flex-start; }
    .chat-msg.user { background: #2563eb; color: #fff; align-self: flex-end; }
    .chat-input-row { display: flex; gap: 10px; }
    .chat-input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 13px; outline: none; }
    .chat-send { background: #38bdf8; color: #0f172a; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .loader { text-align: center; font-weight: bold; color: var(--text-light); padding: 60px; font-size: 16px; }
  </style>
</head>
<body>

<div class="container" id="dashboardApp">
  <div class="loader">✨ Cargando panel de control y telemetría...</div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

  const supabase = createClient(
    'https://hjmmphkxbnuxnpcbawpg.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqbW1waGt4Ym51eG5wY2Jhd3BnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNDgzNjQsImV4cCI6MjEwMTYyNDM2NH0.bCfCDKS1CT7lNCuJI-Vn4gQd-VbFpcEXVj5WfU3ZpNU'
  );

  window.supabaseClient = supabase; // Делаем доступным для глобальных обработчиков

  async function initDashboard() {
    const { data: { session } } = await supabase.auth.getSession();
    
    if (!session) {
      window.location.href = 'auth.html';
      return;
    }

    const user = session.user;

    // 1. Загружаем полный профиль из базы (включая датчики и здоровье)
    const { data: profile } = await supabase
      .from('profiles')
      .select('*, nom035_departments(name, leader)')
      .eq('id', user.id)
      .maybeSingle();

    // 2. Загружаем список цехов
    const { data: departments } = await supabase
      .from('nom035_departments')
      .select('*')
      .order('name');

    // 3. Загружаем последний результат опроса NOM-035
    let surveyData = null;
    const { data: surveyResult } = await supabase
      .from('survey_results')
      .select('*')
      .eq('user_id', user.id)
      .order('created_at', { ascending: false })
      .limit(1)
      .maybeSingle();

    if (surveyResult) {
      surveyData = {
        totalScore: surveyResult.total_score,
        globalRisk: surveyResult.global_risk,
        domainScores: surveyResult.domain_scores,
        categoryScores: surveyResult.category_scores,
        validityStatus: surveyResult.validity_status
      };
    }

    renderDashboard(user, profile, departments || [], surveyData);
  }

  function renderDashboard(user, profile, departments, data) {
    const app = document.getElementById('dashboardApp');

    // Секция выбора департамента
    let departmentSection = '';
    if (profile && profile.nom035_departments) {
      const dept = profile.nom035_departments;
      departmentSection = `
        <div class="card" style="background: var(--success-bg); border-color: #bbf7d0;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
              <h3 style="margin: 0 0 5px 0; color: var(--success-text); font-size: 15px;">📍 Centro de trabajo asignado</h3>
              <p style="margin: 0; font-size: 14px; color: #15803d;"><strong>Departamento:</strong> ${dept.name} &bull; <strong>Responsable:</strong> ${dept.leader || 'Sin asignar'}</p>
            </div>
            <button onclick="showDepartmentSelector()" class="btn btn-secondary" style="font-size: 12px; padding: 8px 14px;">Cambiar</button>
          </div>
        </div>
      `;
    } else {
      let options = `<option value="">-- Selecciona tu departamento --</option>`;
      departments.forEach(d => {
        options += `<option value="${d.id}">${d.name} (Responsable: ${d.leader || 'Ninguno'})</option>`;
      });

      departmentSection = `
        <div class="card" style="border-left: 5px solid #ca8a04; background: var(--warning-bg);">
          <h3 style="margin-top: 0; color: var(--warning-text); font-size: 16px;">⚠️ Selección de departamento obligatoria</h3>
          <p style="font-size: 14px; color: #713f12; margin-bottom: 15px;">Selecciona tu área para agrupar correctamente los resultados:</p>
          <div class="form-group"><select id="userDeptSelect">${options}</select></div>
          <button onclick="saveUserDepartment()" class="btn">Guardar departamento</button>
        </div>
      `;
    }

    // Извлекаем реальные данные для RGB каналов из профиля и опроса
    const pulseVal = profile?.current_pulse || 75; // Канал R (пульс)
    const nomStressVal = data?.totalScore || 20;    // Канал G (стресс NOM-035)
    const healthStressVal = profile?.health_stress_score || 15; // Канал B (модель здоровья)

    // Расчет RGB цветов (нормализация значений 0-255)
    const r = Math.min(255, Math.max(0, Math.round(((pulseVal - 50) / 100) * 255)));
    const g = Math.min(255, Math.max(0, Math.round((nomStressVal / 150) * 255)));
    const b = Math.min(255, Math.max(0, Math.round((healthStressVal / 100) * 255)));

    // Секция датчиков и RGB визуализации
    const sensorsSection = `
      <div class="card" style="border-left: 5px solid #2563eb;">
        <div class="section-title">🛰️ Conexión de Sensores (GPS & Pulso) y Estado RGB</div>
        <p style="font-size: 14px; color: var(--text-light); margin-bottom: 15px;">
          Dispositivos vinculados y visualización matricial en tiempo real basada en telemetría real.
        </p>

        <div style="display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; margin-bottom: 20px; align-items: end;">
          <div class="form-group" style="margin: 0;">
            <label>ID Dispositivo GPS</label>
            <input type="text" id="gpsIdInput" value="${profile?.gps_device_id || ''}" placeholder="Ej. GPS-9035">
          </div>
          <div class="form-group" style="margin: 0;">
            <label>ID Sensor de Pulso</label>
            <input type="text" id="pulseIdInput" value="${profile?.pulse_device_id || ''}" placeholder="Ej. PULSE-02">
          </div>
          <button onclick="saveSensors()" class="btn" style="height: 42px;">Vincular</button>
        </div>

        <div style="background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; align-items: center; justify-content: space-around; flex-wrap: wrap; gap: 20px;">
          <div style="text-align: center;">
            <div id="rgbSquare" style="width: 120px; height: 120px; background-color: rgb(${r}, ${g}, ${b}); border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); margin: 0 auto 10px auto; border: 2px solid rgba(255,255,255,0.8); transition: background-color 0.5s;"></div>
            <span style="font-size: 12px; font-weight: bold; color: var(--text-light);" id="rgbTextCode">RGB(${r}, ${g}, ${b})</span>
          </div>

          <div style="flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 8px; font-size: 13px;">
            <div style="display: flex; justify-content: space-between; background: white; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border);">
              <span style="color: #dc2626; font-weight: bold;">🔴 Canal R (Pulso Real):</span>
              <strong>${pulseVal} bpm</strong>
            </div>
            <div style="display: flex; justify-content: space-between; background: white; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border);">
              <span style="color: #16a34a; font-weight: bold;">🟢 Canal G (Estrés NOM):</span>
              <strong>${nomStressVal} pts</strong>
            </div>
            <div style="display: flex; justify-content: space-between; background: white; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border);">
              <span style="color: #2563eb; font-weight: bold;">🔵 Canal B (Modelo Salud):</span>
              <strong>${healthStressVal}%</strong>
            </div>
          </div>
        </div>
      </div>
    `;

    if (!data) {
      app.innerHTML = `
        <div class="card">
          <div class="header">
            <h2>Mi Panel NOM-035</h2>
            <button id="logoutBtn" class="btn btn-secondary" style="padding: 8px 16px;">Cerrar Sesión</button>
          </div>
          ${departmentSection}
          ${sensorsSection}
          <div style="text-align: center; padding: 20px 0;">
            <p style="color: var(--text-light); margin-bottom: 20px; font-size: 15px;">Aún no has realizado la evaluación psicosocial obligatoria.</p>
            <a href="evaluacion.html" class="btn" style="font-size: 16px; padding: 14px 28px;">🚀 Realizar Cuestionario (Guía III)</a>
          </div>
        </div>
      `;
      setupLogout();
      return;
    }

    let domainsHtml = '';
    for (const [domainName, val] of Object.entries(data.domainScores || {})) {
      const score = typeof val === 'object' && val !== null ? val.score : val;
      const risk = typeof val === 'object' && val !== null ? val.risk : '';
      const css = typeof val === 'object' && val !== null ? val.css : 'blue';
      domainsHtml += `<div class="list-item"><span>${domainName}</span><div style="display:flex;align-items:center;gap:12px;">${risk ? `<span class="badge badge-${css}">${risk}</span>` : ''}<strong>${score} pts</strong></div></div>`;
    }

    let categoriesHtml = '';
    for (const [catName, val] of Object.entries(data.categoryScores || data.category_scores || {})) {
      const score = typeof val === 'object' && val !== null ? val.score : val;
      const risk = typeof val === 'object' && val !== null ? val.risk : '';
      const css = typeof val === 'object' && val !== null ? val.css : 'blue';
      categoriesHtml += `<div class="list-item"><span>${catName}</span><div style="display:flex;align-items:center;gap:12px;">${risk ? `<span class="badge badge-${css}">${risk}</span>` : ''}<strong>${score} pts</strong></div></div>`;
    }

    app.innerHTML = `
      <div class="card">
        <div class="header">
          <div>
            <h2>Panel de Resultados - NOM-035</h2>
            <p style="margin: 4px 0 0 0; color: var(--text-light); font-size: 13px;">Usuario: ${user.email}</p>
          </div>
          <button id="logoutBtn" class="btn btn-secondary" style="padding: 8px 16px;">Cerrar Sesión</button>
        </div>

        ${departmentSection}
        ${sensorsSection}

        <div class="summary-grid">
          <div class="metric-card">
            <h4>Puntuación Global</h4>
            <div class="metric-value">${data.totalScore}</div>
          </div>
          <div class="metric-card" style="--accent: #8b5cf6;">
            <h4>Nivel de Riesgo</h4>
            <div class="metric-value" style="font-size: 20px; margin-top: 4px; color: #7c3aed;">${data.globalRisk || 'Calculado'}</div>
          </div>
          <div class="metric-card" style="--accent: #10b981;">
            <h4>Validez</h4>
            <div class="metric-value" style="font-size: 16px; margin-top: 8px; color: #059669;">${data.validityStatus || 'Válido'}</div>
          </div>
        </div>

        <div class="section-title">📊 Categorías Oficiales</div>
        <div class="list-group" style="margin-bottom: 30px;">${categoriesHtml}</div>

        <div class="section-title">🔍 Dominios Detallados</div>
        <div class="list-group">${domainsHtml}</div>
      </div>

      <div class="chat-container">
        <div class="chat-header">💬 Asistente IA - Norma NOM-035</div>
        <div class="chat-messages" id="chatMessages">
          <div class="chat-msg ai">¡Hola! Analizo tus datos reales de sensores y encuestas. ¿En qué te puedo ayudar?</div>
        </div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" class="chat-input" placeholder="Escribe tu consulta...">
          <button class="chat-send" id="chatSendBtn">Enviar</button>
        </div>
      </div>
    `;

    setupLogout();
    setupAIChat(data);
  }

  // Сохранение идентификаторов датчиков в базу данных Supabase
  window.saveSensors = async function() {
    const gpsId = document.getElementById('gpsIdInput').value.trim();
    const pulseId = document.getElementById('pulseIdInput').value.trim();

    const { data: { session } } = await window.supabaseClient.auth.getSession();
    if (!session) return;

    const { error } = await window.supabaseClient
      .from('profiles')
      .update({ gps_device_id: gpsId, pulse_device_id: pulseId })
      .eq('id', session.user.id);

    if (error) {
      alert('Error al guardar dispositivos: ' + error.message);
      return;
    }
    alert('¡Dispositivos vinculados correctamente en la base de datos!');
  };

  window.saveUserDepartment = async function() {
    const deptId = document.getElementById('userDeptSelect').value;
    if (!deptId) return alert('Selecciona un departamento.');
    const { data: { session } } = await window.supabaseClient.auth.getSession();
    await window.supabaseClient.from('profiles').update({ department_id: deptId }).eq('id', session.user.id);
    location.reload();
  };

  window.showDepartmentSelector = async function() {
    const { data: { session } } = await window.supabaseClient.auth.getSession();
    await window.supabaseClient.from('profiles').update({ department_id: null }).eq('id', session.user.id);
    location.reload();
  };

  function setupAIChat(surveyData) {
    const sendBtn = document.getElementById('chatSendBtn');
    const inputField = document.getElementById('chatInput');
    const messagesContainer = document.getElementById('chatMessages');

    const handleSend = () => {
      const text = inputField.value.trim();
      if (!text) return;
      const userDiv = document.createElement('div');
      userDiv.className = 'chat-msg user';
      userDiv.textContent = text;
      messagesContainer.appendChild(userDiv);
      inputField.value = '';
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      setTimeout(() => {
        const aiDiv = document.createElement('div');
        aiDiv.className = 'chat-msg ai';
        aiDiv.textContent = `Tus datos actuales muestran un puntaje global de ${surveyData.totalScore} puntos en la NOM-035. Mantén la calma y atiende las recomendaciones de ergonomía y pausas activas.`;
        messagesContainer.appendChild(aiDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }, 500);
    };

    sendBtn.addEventListener('click', handleSend);
    inputField.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });
  }

  function setupLogout() {
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await window.supabaseClient.auth.signOut();
      sessionStorage.clear();
      window.location.href = 'auth.html';
    });
  }

  initDashboard();
</script>

</body>
</html>
