<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluación NOM-035 - Guía III (Módulo de Colaborador)</title>
  <style>
    :root { --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --muted: #64748b; --accent: #2563eb; --border: #e2e8f0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 85vh; margin: 0; }
    .container { width: 100%; max-width: 750px; background: var(--card); padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid var(--border); }
    
    .progress-bar { width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; margin-bottom: 25px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }
    
    .header-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .counter { font-size: 14px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .timer-badge { font-size: 13px; background: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 20px; font-weight: 600; }

    .question-text { font-size: 20px; font-weight: 600; margin-bottom: 28px; line-height: 1.4; color: #0f172a; }
    .options-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 35px; }
    .option-label { display: flex; align-items: center; padding: 16px 20px; border: 2px solid var(--border); border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-size: 16px; background: #fff; color: #334155; }
    .option-label:hover { border-color: #cbd5e1; background: #f8fafc; }
    .option-label input { margin-right: 16px; transform: scale(1.2); accent-color: var(--accent); }
    .option-label.selected { border-color: var(--accent); background: #eff6ff; color: #1d4ed8; font-weight: 500; }
    
    .buttons-group { display: flex; justify-content: space-between; gap: 15px; }
    .btn { background: var(--accent); color: white; border: none; padding: 14px 28px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; transition: background 0.2s; width: 100%; text-align: center; }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #e2e8f0; color: #475569; width: auto; flex: 1; }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-primary { flex: 2; }
    
    .welcome-screen { text-align: center; padding: 10px; }
    .welcome-screen h1 { color: #0f172a; margin-bottom: 15px; font-size: 26px; }
    .welcome-screen p { color: var(--muted); margin-bottom: 30px; font-size: 16px; line-height: 1.5; }
    
    .stats-container { background: #f8fafc; border: 1px solid var(--border); padding: 16px; border-radius: 10px; max-height: 250px; overflow-y: auto; margin: 10px 0; font-size: 13px; }
    .result-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); align-items: center; }
    .result-row:last-child { border-bottom: none; }
    
    .risk-nulo { background: #f1f5f9; color: #475569; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
    .risk-bajo { background: #dcfce7; color: #166534; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
    .risk-medio { background: #fef9c3; color: #854d0e; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
    .risk-alto { background: #ffedd5; color: #9a3412; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
    .risk-muy-alto { background: #fee2e2; color: #991b1b; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
  </style>
</head>
<body>

<div class="container" id="app">
  <div class="welcome-screen">
    <h1>Evaluación de Factores de Riesgo Psicosocial</h1>
    <p>Cuestionario confidencial evaluado estrictamente bajo las matrices oficiales de la NOM-035 (Guía de Referencia III).</p>
    <button class="btn" onclick="startQuiz()">Comenzar cuestionario</button>
  </div>
</div>

<footer style="text-align: center; margin-top: 30px; color: var(--muted); font-size: 13px;">
  CRM Sharks + Gemini + ЗДЕСЬ МОЖЕТ БЫТЬ ВАШ УНИВЕРСИТЕТ
</footer>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

  // Замените на ваши реальные ключи Supabase
  const supabase = createClient('ВАШ_SUPABASE_URL', 'ВАШ_SUPABASE_ANON_KEY')

  const NOM035_OfficialEvaluator = {
    getGlobalRisk(score) {
      if (score < 50)  return { text: "Nulo o Despreciable", class: "risk-nulo" };
      if (score < 75)  return { text: "Bajo", class: "risk-bajo" };
      if (score < 99)  return { text: "Medio", class: "risk-medio" };
      if (score < 140) return { text: "Alto", class: "risk-alto" };
      return { text: "Muy Alto", class: "risk-muy-alto" };
    },
    getCategoryRisk(categoryName, score) {
      switch (categoryName) {
        case "Condiciones en el ambiente de trabajo":
          return score < 3 ? { text: "Nulo", class: "risk-nulo" } : score < 5 ? { text: "Bajo", class: "risk-bajo" } : score < 7 ? { text: "Medio", class: "risk-medio" } : score < 9 ? { text: "Alto", class: "risk-alto" } : { text: "Muy Alto", class: "risk-muy-alto" };
        case "Factores propios de la actividad":
          return score < 40 ? { text: "Nulo", class: "risk-nulo" } : score < 55 ? { text: "Bajo", class: "risk-bajo" } : score < 70 ? { text: "Medio", class: "risk-medio" } : score < 85 ? { text: "Alto", class: "risk-alto" } : { text: "Muy Alto", class: "risk-muy-alto" };
        case "Organización del tiempo de trabajo":
          return score < 9 ? { text: "Nulo", class: "risk-nulo" } : score < 13 ? { text: "Bajo", class: "risk-bajo" } : score < 17 ? { text: "Medio", class: "risk-medio" } : score < 21 ? { text: "Alto", class: "risk-alto" } : { text: "Muy Alto", class: "risk-muy-alto" };
        case "Liderazgo y relaciones en el trabajo":
          return score < 28 ? { text: "Nulo", class: "risk-nulo" } : score < 38 ? { text: "Bajo", class: "risk-bajo" } : score < 48 ? { text: "Medio", class: "risk-medio" } : score < 58 ? { text: "Alto", class: "risk-alto" } : { text: "Muy Alto", class: "risk-muy-alto" };
        case "Entorno organizacional":
          return score < 10 ? { text: "Nulo", class: "risk-nulo" } : score < 14 ? { text: "Bajo", class: "risk-bajo" } : score < 18 ? { text: "Medio", class: "risk-medio" } : score < 24 ? { text: "Alto", class: "risk-alto" } : { text: "Muy Alto", class: "risk-muy-alto" };
        default:
          return { text: "Nulo", class: "risk-nulo" };
      }
    },
    getDomainRisk(domainName, score) {
      switch (domainName) {
        case "Condiciones en el ambiente de trabajo":
          return score < 3 ? { text: "Nulo", class: "risk-nulo" } : score < 5 ? { text: "Bajo", class: "risk-bajo" } : score < 7 ? { text: "Medio", class: "risk-medio" } : score < 9 ? { text: "Alto", class: "risk-alto" } : { text: "Muy Alto", class: "risk-muy-alto" };
        case "Carga de trabajo":
          return score < 12 ? { text: "Nulo", class: "risk-nulo" } : score < 16 ? { text: "Bajo", class: "risk-bajo" } : score < 20 ? { text: "Medio", class: "risk-medio" } : score < 24 ? { text: "Alto", class: "risk-alto" } : { text: "Muy Alto", class: "risk-muy-alto" };
        case "Falta de control sobre el trabajo":
          return score < 11 ? { text: "Nulo", class: "risk-nulo" } : score < 16 ? { text: "Bajo", class: "risk-bajo" } : score < 21 ? { text: "Medio", class: "risk-medio" } : score < 26 ? { text: "Alto", class: "risk-alto" } : { text: "Muy Alto", class: "risk-muy-alto" };
        case "Jornada de trabajo":
          return score < 1 ? { text: "Nulo", class: "risk-nulo" } : score < 2 ? { text: "Bajo", class: "risk-bajo" } : score < 4 ? { text: "Medio", class: "risk-medio" } : score < 6 ? { text: "Alto", class: "risk-alto" } : { text: "Muy Alto", class: "risk-muy-alto" };
        case "Interferencia en la relación trabajo-familia":
          return score < 4 ? { text: "Nulo", class: "risk-nulo" } : score < 6 ? { text: "Bajo", class: "risk-bajo" } : score < 8 ? { text: "Medio", class: "risk-medio" } : score < 10 ? { text: "Alto", class: "risk-alto" } : { text: "Muy Alto", class: "risk-muy-alto" };
        case "Liderazgo":
          return score < 4 ? { text: "Nulo", class: "risk-nulo" } : score < 6 ? { text: "Bajo", class: "risk-bajo" } : score < 10 ? { text: "Medio", class: "risk-medio" } : score < 14 ? { text: "Alto", class: "risk-alto" } : { text: "Muy Alto", class: "risk-muy-alto" };
        case "Relaciones en el trabajo":
          return score < 10 ? { text: "Nulo", class: "risk-nulo" } : score < 13 ? { text: "Bajo", class: "risk-bajo" } : score < 17 ? { text: "Medio", class: "risk-medio" } : score < 21 ? { text: "Alto", class: "risk-alto" } : { text: "Muy Alto", class: "risk-muy-alto" };
        case "Violencia laboral":
          return score < 7 ? { text: "Nulo", class: "risk-nulo" } : score < 10 ? { text: "Bajo", class: "risk-bajo" } : score < 13 ? { text: "Medio", class: "risk-medio" } : score < 16 ? { text: "Alto", class: "risk-alto" } : { text: "Muy Alto", class: "risk-muy-alto" };
        case "Reconocimiento del desempeño":
          return score < 6 ? { text: "Nulo", class: "risk-nulo" } : score < 10 ? { text: "Bajo", class: "risk-bajo" } : score < 14 ? { text: "Medio", class: "risk-medio" } : score < 18 ? { text: "Alto", class: "risk-alto" } : { text: "Muy Alto", class: "risk-muy-alto" };
        case "Insuficiente sentido de pertenencia e inestabilidad":
          return score < 4 ? { text: "Nulo", class: "risk-nulo" } : score < 6 ? { text: "Bajo", class: "risk-bajo" } : score < 8 ? { text: "Medio", class: "risk-medio" } : score < 10 ? { text: "Alto", class: "risk-alto" } : { text: "Muy Alto", class: "risk-muy-alto" };
        default:
          return { text: "Nulo", class: "risk-nulo" };
      }
    }
  };

  let currentQuestions = [];
  let currentIndex = 0;
  let userAnswers = {};
  let questionStartTime = 0;
  let timerInterval = null;

  window.startQuiz = async function() {
    const app = document.getElementById('app');
    app.innerHTML = `<div class="loader" style="text-align:center; padding:20px; color:#64748b; font-weight:bold;">Conectando con Supabase y cargando los 72 reactivos...</div>`;

    try {
      const { data, error } = await supabase
        .from('v_nom035_questionnaire_map')
        .select('*')
        .order('question_number', { ascending: true });

      if (error) throw error;
      // --- ДОБАВЛЕННЫЙ ОТЛАДЧИК ---
      console.log("Данные из Supabase:", data);
      console.log("Количество полученных вопросов:", data ? data.length : 0);
      // ----------------------------
      currentQuestions = data.map(q => ({
        id: q.question_number,
        question: q.question_text,
        category: q.category_name,
        domain: q.domain_name,
        scores: q.is_inverse ? 
            { "Siempre": 4, "Casi siempre": 3, "Algunas veces": 2, "Casi nunca": 1, "Nunca": 0 } :
            { "Siempre": 0, "Casi siempre": 1, "Algunas veces": 2, "Casi nunca": 3, "Nunca": 4 }
      }));

      currentIndex = 0;
      userAnswers = {};
      renderQuestion();
    } catch (err) {
      app.innerHTML = `<h3 style="color: #991b1b;">Error al cargar el cuestionario</h3><p style="color: #64748b;">${err.message}</p>`;
    }
  }

  function renderQuestion() {
    const app = document.getElementById('app');
    if (currentIndex >= currentQuestions.length) {
      renderResults();
      return;
    }

    const q = currentQuestions[currentIndex];
    const progress = Math.round((currentIndex / currentQuestions.length) * 100);
    questionStartTime = Date.now();

    app.innerHTML = `
      <div class="header-info">
        <div class="counter">Pregunta ${currentIndex + 1} de ${currentQuestions.length}</div>
        <div class="timer-badge" id="timerDisplay">⏱️ 0s</div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%;"></div></div>
      <div class="question-text">${q.question}</div>
      <div class="options-list">
        ${Object.entries(q.scores).map(([text, val]) => `
          <label class="option-label" onclick='window.selectOption(this, ${val}, ${q.id}, ${JSON.stringify(q.category)}, ${JSON.stringify(q.domain)})'>
            <input type="radio" name="q_${q.id}" value="${val}"> ${text}
          </label>
        `).join('')}
      </div>
      <div class="buttons-group">
        ${currentIndex > 0 ? `<button class="btn btn-secondary" onclick="window.prevQuestion()">Anterior</button>` : '<div></div>'}
        <button class="btn btn-primary" onclick="window.nextQuestion()">${currentIndex === currentQuestions.length - 1 ? 'Finalizar' : 'Siguiente'}</button>
      </div>
    `;

    if (timerInterval) clearInterval(timerInterval);
    let sec = 0;
    timerInterval = setInterval(() => {
      sec++;
      const timerEl = document.getElementById('timerDisplay');
      if (timerEl) timerEl.textContent = `⏱️ ${sec}s`;
    }, 1000);
  }

  window.selectOption = function(el, val, id, cat, dom) {
    document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
    el.classList.add('selected');
    el.querySelector('input').checked = true;
    userAnswers[id] = { score: val, category: cat, domain: dom };
  }

  window.nextQuestion = function() {
    const q = currentQuestions[currentIndex];
    if (!userAnswers[q.id]) {
      alert("Por favor, selecciona una opción para continuar.");
      return;
    }
    clearInterval(timerInterval);
    currentIndex++;
    renderQuestion();
  }

  window.prevQuestion = function() {
    clearInterval(timerInterval);
    if (currentIndex > 0) { currentIndex--; renderQuestion(); }
  }

  function renderResults() {
    if (timerInterval) clearInterval(timerInterval);
    let totalScore = 0, domainScores = {}, catScores = {};

    for (let id in userAnswers) {
      let a = userAnswers[id];
      totalScore += a.score;
      domainScores[a.domain] = (domainScores[a.domain] || 0) + a.score;
      catScores[a.category] = (catScores[a.category] || 0) + a.score;
    }

    let globalRisk = NOM035_OfficialEvaluator.getGlobalRisk(totalScore);

    let domHtml = '';
    for (let d in domainScores) {
      let r = NOM035_OfficialEvaluator.getDomainRisk(d, domainScores[d]);
      domHtml += `<div class="result-row"><span><b>${d}:</b> ${domainScores[d]} pts</span><span class="${r.class}">${r.text}</span></div>`;
    }

    let catHtml = '';
    for (let c in catScores) {
      let r = NOM035_OfficialEvaluator.getCategoryRisk(c, catScores[c]);
      catHtml += `<div class="result-row"><span><b>${c}:</b> ${catScores[c]} pts</span><span class="${r.class}">${r.text}</span></div>`;
    }

    document.getElementById('app').innerHTML = `
      <div style="text-align: left;">
        <h2 style="text-align: center; color: #0f172a; font-size: 20px;">📊 Dictamen Oficial NOM-035 (Guía III)</h2>
        <div style="background: #eff6ff; border: 1px solid #bfdbfe; padding: 12px; border-radius: 10px; text-align: center; margin: 15px 0;">
          <div style="font-size: 14px; color: #1e40af; font-weight: 600;">Calificación Global: ${totalScore} puntos</div>
          <div style="font-size: 15px; margin-top: 4px;">Nivel de Riesgo General: <span class="${globalRisk.class}">${globalRisk.text}</span></div>
        </div>
        <p style="font-size: 13px; font-weight: bold; color: #334155;">Evaluación por Dominios:</p>
        <div class="stats-container">${domHtml}</div>
        <p style="font-size: 13px; font-weight: bold; color: #334155; margin-top: 10px;">Evaluación por Categorías:</p>
        <div class="stats-container">${catHtml}</div>
        <button class="btn" onclick="location.reload()" style="margin-top: 20px;">Finalizar y Salir</button>
      </div>
    `;
  }
</script>

</body>
</html>
