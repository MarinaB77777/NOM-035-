<!DOCTYPE html>
<html lang="es-MX"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>IA analítica</title>
<style>
  :root{--bg:#0f172a;--panel:#1e293b;--border:#334155;--text:#f8fafc;--muted:#94a3b8;--accent:#8b5cf6;--blue:#3b82f6;--danger:#ef4444}*{box-sizing:border-box}body{margin:0;padding:26px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:900px;margin:auto}header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:22px}h1{margin:0 0 8px;font-size:27px}p{color:var(--muted);line-height:1.55;margin:0}.btn{border:0;background:var(--accent);color:#fff;border-radius:9px;padding:11px 16px;font-weight:750;cursor:pointer;text-decoration:none}.btn.secondary{background:#475569}.btn:disabled{opacity:.55;cursor:not-allowed}.context{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:18px 0}.card{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:18px}.card h2{font-size:15px;margin:0 0 9px}.state{font-size:13px;color:#cbd5e1}.chat{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px}.messages{min-height:180px;max-height:480px;overflow:auto;display:flex;flex-direction:column;gap:11px;margin-bottom:15px}.msg{max-width:92%;padding:12px 14px;border-radius:11px;line-height:1.55;white-space:pre-wrap}.msg.user{align-self:flex-end;background:#5b21b6}.msg.ai{align-self:flex-start;background:#334155}.msg.error{align-self:flex-start;background:#7f1d1d}.inputrow{display:flex;gap:10px}textarea{flex:1;min-height:72px;resize:vertical;border:1px solid #475569;border-radius:10px;background:#111827;color:#fff;padding:12px;font:inherit}.limits{font-size:12px;color:var(--muted);margin:12px 0 0}.missing{border:1px solid #7c2d12;background:#431407;padding:13px;border-radius:10px;color:#fed7aa;margin:14px 0}@media(max-width:600px){body{padding:17px}header,.inputrow{flex-direction:column}.btn{width:100%;text-align:center}}
</style></head><body><main class="shell"><header><div><h1 id="title">IA analítica</h1><p id="subtitle"></p></div><a class="btn secondary" id="back" href="index.html">Volver</a></header><section class="context" id="context"></section><section class="chat"><div class="messages" id="messages"></div><div class="inputrow"><textarea id="question"></textarea><button class="btn" id="send">Analizar</button></div><p class="limits" id="limits"></p></section></main>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
const supabase=createClient('https://hjmmphkxbnuxnpcbawpg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqbW1waGt4Ym51eG5wY2Jhd3BnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNDgzNjQsImV4cCI6MjEwMTYyNDM2NH0.bCfCDKS1CT7lNCuJI-Vn4gQd-VbFpcEXVj5WfU3ZpNU');
const health=JSON.parse(sessionStorage.getItem('health_resources_last_result')||'null'),nom=JSON.parse(sessionStorage.getItem('nom035_last_result')||'null');const lang=health?.language==='en-US'?'en-US':'es-MX';document.documentElement.lang=lang;
const tr=lang==='en-US'?{title:'AI-assisted joint analysis',sub:'Explainable review of derived results only. No raw answers are sent to AI.',back:'Back',health:'Health Model',nom:'NOM-035',ready:'Result available',missing:'Result missing',placeholder:'What do the concordances and mismatches mean?',send:'Analyze',limits:'Research orientation only. No diagnosis, causal conclusion, individual employment decision, or direct scale mixing.',welcome:'I can explain the block-by-block evidence map and its uncertainty. The analysis uses only derived scores and never receives raw or critical responses.',need:'Complete the Health Model resource assessment before requesting joint analysis.',working:'Analyzing derived evidence…'}:{title:'Análisis conjunto asistido por IA',sub:'Revisión explicable únicamente de resultados derivados. Las respuestas originales no se envían a la IA.',back:'Volver',health:'Health Model',nom:'NOM-035',ready:'Resultado disponible',missing:'Falta el resultado',placeholder:'¿Qué significan las concordancias y discrepancias?',send:'Analizar',limits:'Solo orientación de investigación. Sin diagnóstico, conclusión causal, decisión laboral individual ni mezcla directa de escalas.',welcome:'Puedo explicar el mapa de evidencias bloque por bloque y su incertidumbre. El análisis utiliza únicamente puntuaciones derivadas y nunca recibe respuestas originales ni críticas.',need:'Complete la evaluación de recursos Health Model antes de solicitar el análisis conjunto.',working:'Analizando la evidencia derivada…'};
for(const id of['title','back'])document.getElementById(id).textContent=tr[id];document.getElementById('subtitle').textContent=tr.sub;document.getElementById('question').placeholder=tr.placeholder;document.getElementById('send').textContent=tr.send;document.getElementById('limits').textContent=tr.limits;
document.getElementById('context').innerHTML=`<div class="card"><h2>${tr.health}</h2><div class="state">${health?'✓ '+tr.ready:'— '+tr.missing}</div></div><div class="card"><h2>${tr.nom}</h2><div class="state">${nom?'✓ '+tr.ready:'— '+tr.missing}</div></div>`;
const messages=document.getElementById('messages'),send=document.getElementById('send'),question=document.getElementById('question');
function add(text,type){const div=document.createElement('div');div.className=`msg ${type}`;div.textContent=text;messages.appendChild(div);messages.scrollTop=messages.scrollHeight;return div}add(health?tr.welcome:tr.need,health?'ai':'error');if(!health){send.disabled=true;question.disabled=true}
send.addEventListener('click',async()=>{const text=question.value.trim()||tr.placeholder;add(text,'user');question.value='';send.disabled=true;const pending=add(tr.working,'ai');try{const{data:{session}}=await supabase.auth.getSession();if(!session)throw new Error('AUTHENTICATION_REQUIRED');const payload={language:lang,question:text,health:{resourceScores:health.resourceScores,blockComparisons:(health.blockComparisons||[]).map(({block,concordance,resourceDeficit,markerSeverity,bandDistance})=>({block,concordance,resourceDeficit,markerSeverity,bandDistance})),recoverySignal:health.recoverySignal,expectationSignal:health.expectationSignal,readinessStatus:health.readinessStatus},nom035:nom?{globalRisk:nom.globalRisk,domainScores:nom.domainScores,validityStatus:nom.validityStatus}:null};const response=await fetch('/api/ai-analysis',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok)throw new Error(result.error+(result.action?`: ${result.action}`:''));pending.textContent=result.analysis}catch(error){pending.className='msg error';pending.textContent=error.message}finally{send.disabled=false}});
question.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter')send.click()});
</script><script src="./site_navigation.js"></script></body></html>
