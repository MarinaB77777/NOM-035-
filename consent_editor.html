<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Editor de consentimientos</title>
  <style>
    :root{--bg:#f8fafc;--card:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--accent:#2563eb}
    *{box-sizing:border-box}body{margin:0;padding:24px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:960px;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:26px;margin-top:18px}h1{margin:0;font-size:25px}p{color:var(--muted);line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-weight:750;font-size:13px;margin:14px 0 6px}input,textarea,select{width:100%;border:1px solid var(--border);border-radius:9px;padding:11px;font:inherit}textarea{min-height:260px;resize:vertical}.btn{display:inline-block;border:0;border-radius:9px;padding:11px 16px;background:var(--accent);color:#fff;font-weight:750;text-decoration:none;cursor:pointer}.btn.secondary{background:#64748b}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:20px}.notice{padding:12px;border-radius:9px;margin-top:14px}.error{background:#fef2f2;color:#991b1b}.success{background:#ecfdf5;color:#065f46}footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}.actions{flex-direction:column}.btn{text-align:center}}
  </style>
</head>
<body>
<main class="shell">
  <div class="top"><h1>Consentimientos estándar</h1><a class="btn secondary" href="admin.html">Volver</a></div>
  <div class="card">
    <label for="consentType" style="margin-top:0">Documento</label>
    <select id="consentType">
      <option value="health">Health Model · una sesión de cuestionario</option>
      <option value="sensor">Sensores y geocerca · una sesión de medición</option>
    </select>
  </div>
  <div class="card" id="app"><p>Cargando la versión activa…</p></div>
  <footer>CRM Sharks &amp; Ray · NOM-035 + Health Model Research</footer>
</main>
<script type="module">
  import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
  const supabase=createClient(
    'https://hjmmphkxbnuxnpcbawpg.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqbW1waGt4Ym51eG5wY2Jhd3BnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNDgzNjQsImV4cCI6MjEwMTYyNDM2NH0.bCfCDKS1CT7lNCuJI-Vn4gQd-VbFpcEXVj5WfU3ZpNU'
  );
  const app=document.getElementById('app');
  const esc=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));

  function config(){
    return document.getElementById('consentType').value==='sensor'
      ? {table:'measurement_consent_versions',rpc:'create_measurement_consent_version',label:'Sensores y geocerca'}
      : {table:'health_resource_consent_versions',rpc:'create_health_resource_consent_version',label:'Health Model'};
  }

  async function load(){
    app.innerHTML='<p>Cargando la versión activa…</p>';
    const {data:{session}}=await supabase.auth.getSession();
    if(!session){
      app.innerHTML='<div class="notice error">Debe iniciar sesión con una cuenta autorizada.</div><div class="actions"><a class="btn" href="auth.html">Iniciar sesión</a></div>';
      return;
    }
    const manager=await supabase.rpc('is_measurement_manager');
    if(manager.error||manager.data!==true){
      app.innerHTML='<div class="notice error">Esta cuenta no tiene permiso para crear versiones de consentimiento.</div>';
      return;
    }
    const selected=config();
    const {data,error}=await supabase.from(selected.table).select('*').eq('status','active').order('version',{ascending:false}).limit(1).maybeSingle();
    if(error||!data)throw error||new Error('ACTIVE_CONSENT_NOT_FOUND');
    app.innerHTML=`
      <h2 style="margin-top:0">${esc(selected.label)}</h2>
      <p>Versión activa: <strong>${Number(data.version)}</strong>. Al guardar se crea una versión nueva. Las sesiones ya firmadas conservan su texto, versión y hash.</p>
      <div class="grid">
        <section><h3>Español (México)</h3><label for="titleEs">Título</label><input id="titleEs" value="${esc(data.title_es)}"><label for="textEs">Texto</label><textarea id="textEs">${esc(data.text_es)}</textarea></section>
        <section><h3>English (United States)</h3><label for="titleEn">Title</label><input id="titleEn" value="${esc(data.title_en)}"><label for="textEn">Text</label><textarea id="textEn">${esc(data.text_en)}</textarea></section>
      </div>
      <div id="message"></div>
      <div class="actions"><a class="btn secondary" href="admin.html">Cancelar</a><button class="btn" id="saveConsent">Crear y activar nueva versión</button></div>`;
    document.getElementById('saveConsent').addEventListener('click',save);
  }

  async function save(){
    const button=document.getElementById('saveConsent');button.disabled=true;
    const selected=config();
    const {data,error}=await supabase.rpc(selected.rpc,{
      p_title_es:document.getElementById('titleEs').value,
      p_text_es:document.getElementById('textEs').value,
      p_title_en:document.getElementById('titleEn').value,
      p_text_en:document.getElementById('textEn').value
    });
    const message=document.getElementById('message');
    if(error){message.className='notice error';message.textContent=error.message;button.disabled=false;return}
    message.className='notice success';
    message.textContent=`Versión ${data} activada. Las sesiones anteriores permanecen sin cambios.`;
    setTimeout(load,900);
  }
  document.getElementById('consentType').addEventListener('change',()=>load().catch(showError));
  function showError(error){app.innerHTML=`<div class="notice error">${esc(error.message)}</div>`}
  load().catch(showError);
</script>
<script src="./site_navigation.js"></script>
</body>
</html>
